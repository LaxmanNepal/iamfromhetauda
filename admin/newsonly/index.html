<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><style>:root{--bg:#eef2f7;--ink:#101828;--muted:#667085;--line:#d0d5dd;--accent:#e11d48}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;background:radial-gradient(circle at 0 0,#fff,transparent 35%),#eef2f7}.wrap{max-width:1200px;margin:auto;padding:14px}.box{background:rgba(255,255,255,.78);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 12px 40px #10182812}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:13px;object-fit:cover}.eyebrow{font-size:10px;color:var(--accent);font-weight:900}.muted{color:var(--muted);font-size:12px}button,input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:850}.primary{background:#111827;color:#fff}.accent{background:var(--accent);border-color:var(--accent);color:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:330px 1fr;gap:12px}.stories{max-height:calc(100vh - 150px);overflow:auto}.story{display:flex;gap:8px;padding:9px;border:1px solid var(--line);border-radius:14px;margin:7px 0;background:#fff;cursor:pointer}.story.active{outline:2px solid var(--accent)}.story img{width:76px;height:62px;object-fit:cover;border-radius:9px;flex:none}.story b{font-size:12px;line-height:1.5}.preview{border-radius:18px;background:#111827;color:#fff;padding:22px;min-height:180px;white-space:pre-wrap;font-size:18px;line-height:1.8}.label{font-size:11px;font-weight:850;display:grid;gap:5px}.label>*{width:100%}@media(max-width:760px){.wrap{padding:7px}.grid{grid-template-columns:1fr}.stories{max-height:280px}.box{padding:12px}.top{align-items:flex-start}.preview{font-size:16px}}<style>.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}.nav a{display:inline-flex;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:850}.nav a.active{background:#111827;color:#fff}@media(max-width:760px){.nav{gap:4px}.nav a{font-size:9px;padding:6px 8px}}</style></style></head><title>News Only — I Am From Hetauda</title></head><body><main class="wrap"><section class="box"><div class="top"><div class="brand"><img class="logo" src="../../logo.jpg"><div><div class="eyebrow">NEWS ONLY</div><h1 style="margin:2px 0;font-size:22px">📝 Headline Post</h1><div class="muted">छानिएको समाचार → headline + hashtags → Copy</div></div></div><button onclick="location.href='../'">← Admin</button></div></section><nav class="nav" aria-label="Admin tools"><a href="../">🗂️ Admin</a><a class="active" href="../newsonly/">📝 News Only</a><a  href="../newswithimage/">🖼️ News With Image</a><a  href="../photo-editor/">🎨 Photo Editor</a></nav><section class="grid"><aside class="box stories"><div class="top"><b>Selected News</b><button onclick="shuffle()">🔀</button></div><input id="q" placeholder="🔎 Search…" oninput="list()" style="width:100%;margin-top:8px"><div id="list"></div></aside><section><div class="box"><label class="label">Headline<textarea id="title" rows="5" oninput="preview()"></textarea></label><label class="label" style="margin-top:9px">Tags<input id="tags" value="#iamfromhetauda #nepalnews" oninput="preview()"></label></div><div class="box"><div class="top"><b>Copy-ready preview</b><button class="accent" onclick="copy()">📋 Copy Headline</button></div><div id="preview" class="preview" style="margin-top:10px"></div></div></section></section></main><script>
let items=JSON.parse(localStorage.getItem("iam_selected_news")||"[]"),cur=items[0],$=id=>document.getElementById(id);
function list(){let q=$("q").value.toLowerCase(),a=items.filter(n=>(n.title+" "+(n.source||"")).toLowerCase().includes(q));$("list").innerHTML=a.map(n=>'<div class="story '+(n===cur?"active":"")+'" onclick="pick('+items.indexOf(n)+')">'+(n.image?'<img src="'+safe(n.image)+'">':"")+'<div><b>'+safe(n.title)+'</b><div class="muted">'+safe(n.source||"")+'</div></div></div>').join("")||'<div class="muted">Admin बाट news select गर्नुहोस्।</div>'}
function safe(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function pick(i){cur=items[i];$("title").value=cur.title;list();preview()}
function shuffle(){items.sort(()=>Math.random()-.5);cur=items[0];if(cur)$("title").value=cur.title;list();preview()}
function preview(){let s=$("title").value.trim()+"\n\n"+$("tags").value.trim();$("preview").textContent=s}
async function copy(){await navigator.clipboard.writeText($("preview").textContent);alert("Headline copied ✓")}
if(cur)$("title").value=cur.title;list();preview();
</script></body></html>
