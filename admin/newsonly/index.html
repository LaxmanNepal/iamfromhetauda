<!doctype html>
<html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>News Only — I Am From Hetauda</title>
<style>
:root{--bg:#eef2f7;--ink:#101828;--muted:#667085;--line:#d0d5dd;--accent:#e11d48;--dark:#111827;--ok:#059669}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;background:radial-gradient(circle at 0 0,#fff,transparent 35%),#eef2f7}.wrap{max-width:1250px;margin:auto;padding:12px}.box{background:rgba(255,255,255,.82);backdrop-filter:blur(20px);border:1px solid #fff;border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:0 12px 35px #10182812}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:13px;object-fit:cover}.eyebrow{font-size:10px;color:var(--accent);font-weight:900}.muted{color:var(--muted);font-size:11px}button,input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:800}.primary{background:var(--dark);color:#fff}.accent{background:var(--accent);border-color:var(--accent);color:#fff}.actions{display:flex;gap:6px;flex-wrap:wrap}.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.nav a{display:inline-flex;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:850}.nav a.active{background:var(--dark);color:#fff}.grid{display:grid;grid-template-columns:350px 1fr;gap:10px}.stories{max-height:calc(100vh - 145px);overflow:auto}.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.story{display:flex;gap:8px;padding:9px;border:1px solid var(--line);border-radius:14px;margin:7px 0;background:#fff;cursor:pointer}.story.active{outline:2px solid var(--accent);background:#fff7f9}.story img{width:78px;height:62px;object-fit:cover;border-radius:9px;flex:none}.story b{font-size:12px;line-height:1.45}.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.badge{font-size:9px;padding:2px 5px;border-radius:999px;background:#eef2ff}.badge.local{background:#dcfce7;color:#166534}.badge.ver{background:#dbeafe;color:#1d4ed8}.badge.new{background:#fef3c7;color:#92400e}.preview{border-radius:18px;background:#111827;color:#fff;padding:22px;min-height:190px;white-space:pre-wrap;font-size:19px;line-height:1.8}.label{font-size:11px;font-weight:850;display:grid;gap:5px}.label>*{width:100%}.toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:11px 15px;border-radius:12px;box-shadow:0 10px 30px #0004;display:none;z-index:50}.count{font-size:11px;font-weight:800;color:var(--ok)}@media(max-width:780px){.grid{grid-template-columns:1fr}.stories{max-height:330px}.wrap{padding:7px}.preview{font-size:16px}.filters{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap">
<section class="box"><div class="top"><div class="brand"><img class="logo" src="../../logo.jpg"><div><div class="eyebrow">NEWS ONLY</div><h1 style="margin:2px 0;font-size:21px">📝 Headline Post Studio</h1><div class="muted">Live news → clean headline → platform-ready copy</div></div></div><div class="actions"><button onclick="location.href='../'">← Admin</button><button onclick="loadLive()">↻</button></div></div></section>
<nav class="nav"><a href="../">🗂️ Admin</a><a class="active" href="../newsonly/">📝 News Only</a><a href="../newswithimage/">🖼️ News With Image</a><a href="../photo-editor/">🎨 Photo Editor</a></nav>
<section class="grid"><aside class="box stories"><div class="top"><b>Live News</b><span class="count" id="count"></span></div><input id="q" placeholder="🔎 Search headline/source…" oninput="renderList()" style="width:100%;margin-top:7px"><div class="filters"><select id="cat" onchange="renderList()"><option value="">सबै category</option><option value="nepal">नेपाल</option><option value="politics">राजनीति</option><option value="business">अर्थतन्त्र</option><option value="society">समाज</option><option value="sports">खेलकुद</option><option value="tech">प्रविधि</option><option value="world">विश्व</option></select><select id="sort" onchange="renderList()"><option value="score">Best ranked</option><option value="new">Newest</option><option value="local">Hetauda first</option><option value="verified">Verified first</option></select></div><div class="actions" style="margin-top:7px"><button onclick="selectTop(5)">⭐ Top 5</button><button onclick="selectTop(8)">⭐ Top 8</button><button onclick="smart()">🧠 Smart</button></div><div id="list"></div></aside>
<section><div class="box"><div class="actions" style="margin-bottom:9px"><button onclick="cleanTitle()">✨ Clean headline</button><button onclick="breaking()">🚨 Breaking</button><button onclick="resetTitle()">↺ Original</button></div><label class="label">Headline<textarea id="title" rows="4" oninput="preview()"></textarea></label><label class="label" style="margin-top:9px">Hashtags<input id="tags" value="#iamfromhetauda #nepalnews" oninput="preview()"></label></div>
<div class="box"><div class="top"><b>Copy-ready</b><span class="muted" id="meta"></span></div><div id="preview" class="preview" style="margin-top:9px"></div><div class="actions" style="margin-top:9px"><button class="accent" onclick="copyText('preview')">📋 Copy All</button><button onclick="copyText('title')">📋 Copy Headline</button><button onclick="copyPlatform('facebook')">📘 Facebook</button><button onclick="copyPlatform('whatsapp')">🟢 WhatsApp</button><button onclick="copyPlatform('instagram')">📸 Instagram</button><button onclick="copyPlatform('x')">𝕏 X</button></div></div>
</section></section>
<section class="box" id="historyBox"><div class="top"><div><b>🗂️ Post History</b><div class="muted">तयार गरिएका पोस्टहरू — duplicate नहोस् भनेर यहाँ सुरक्षित हुन्छन्</div></div><div class="actions"><button onclick="clearHistory()">Clear History</button></div></div><div id="historyList" style="margin-top:8px"></div></section></main><div id="toast" class="toast"></div>
<script>
let items=[],cur=null,original="",selectedLinks=new Set(JSON.parse(localStorage.getItem("iam_news_selected_links")||"[]"));const $=id=>document.getElementById(id);\nfunction imgSrc(n){const p=n?.image_local||n?.image||"";return n?.image_local&&p.startsWith("images/")?"../../"+p:p}
const catNames={nepal:"नेपाल",politics:"राजनीति",business:"अर्थतन्त्र",society:"समाज",sports:"खेलकुद",tech:"प्रविधि",world:"विश्व"};
function safe(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function age(t){if(!t)return"";let h=Math.max(0,(Date.now()-new Date(t).getTime())/36e5);return h<1?Math.round(h*60)+"m":h<24?Math.round(h)+"h":Math.round(h/24)+"d"}
function score(n){return +(n.score||0)}
function filtered(){let q=$("q").value.trim().toLowerCase(),cat=$("cat").value,a=items.filter(n=>(!q||(n.title+" "+(n.source||"")+" "+(n.description||"")).toLowerCase().includes(q))&&(!cat||n.category===cat));let s=$("sort").value;if(s==="new")a.sort((a,b)=>new Date(b.published||0)-new Date(a.published||0));else if(s==="local")a.sort((a,b)=>(b.local?1:0)-(a.local?1:0)||score(b)-score(a));else if(s==="verified")a.sort((a,b)=>(b.verified?1:0)-(a.verified?1:0)||score(b)-score(a));else a.sort((a,b)=>score(b)-score(a)||new Date(b.published||0)-new Date(a.published||0));return a}
function renderList(){let a=filtered();$("count").textContent=items.length+" news";$("list").innerHTML=a.map(n=>{let i=items.indexOf(n),sel=selectedLinks.has(n.link);return '<div class="story '+(n===cur?"active ":"")+(sel?"selected":"")+'" onclick="pick('+i+')">'+(imgSrc(n)?'<img src="'+safe(imgSrc(n))+'">':"")+'<div style="min-width:0"><b>'+safe(n.title)+'</b><div class="muted">'+safe(n.source||"")+" • "+age(n.published)+"</div><div class="badges">"+(n.local?'<span class="badge local">📍 Hetauda</span>':"")+(n.verified?'<span class="badge ver">✓ '+(n.source_count||2)+" sources</span>":"")+(selectedLinks.has(n.link)?'<span class="badge new">✓ Selected</span>':"")+'<span class="badge">'+safe(catNames[n.category]||n.category||"नेपाल")+"</span></div></div></div>" }).join("")||'<div class="muted">समाचार भेटिएन।</div>'}
function pick(i){cur=items[i];original=cur?.title||"";$("title").value=original;selectedLinks.add(cur.link);localStorage.setItem("iam_news_selected_links",JSON.stringify([...selectedLinks].slice(-100)));$("meta").textContent=(cur.source||"")+" • "+age(cur.published);renderList();preview()}
function selectTop(n){filtered().slice(0,n).forEach(x=>selectedLinks.add(x.link));localStorage.setItem("iam_news_selected_links",JSON.stringify([...selectedLinks].slice(-100)));renderList();toast(n+" news selected ✓")}
function smart(){let a=[...items].sort((x,y)=>((y.local?18:0)+(y.verified?14:0)+score(y))-((x.local?18:0)+(x.verified?14:0)+score(x)));selectTop(5);if(a[0])pick(items.indexOf(a[0]))}
function shuffle(){items.sort(()=>Math.random()-.5);renderList()}
function cleanTitle(){let t=$("title").value.replace(/^["“”]+|["“”]+$/g,"").replace(/\s+/g," ").replace(/^(ब्रेकिङ|breaking)[:：-]\s*/i,"").trim();$("title").value=t;preview();toast("Headline cleaned ✓")}
function breaking(){$("title").value="🚨 ब्रेकिङ: "+$("title").value.replace(/^🚨\s*ब्रेकिङ:\s*/,"");preview()}
function resetTitle(){$("title").value=original;preview()}
function preview(){$("preview").textContent=$("title").value.trim()+"\n\n"+$("tags").value.trim()}
function getHistory(){try{return JSON.parse(localStorage.getItem("iam_post_history")||"[]")}catch(e){return[]}}
function setStatus(id,status,platform){let a=getHistory().map(x=>x.id===id?{...x,status,platform:platform||x.platform||"",statusAt:new Date().toISOString()}:x);localStorage.setItem("iam_post_history",JSON.stringify(a));renderHistory();toast(status==="posted"?"Marked as posted ✓":"Marked ready ✓")}
function statusBadge(x){return x.status==="posted"?'<span class="badge" style="background:#dcfce7;color:#166534">🟢 Posted'+(x.platform?" • "+safe(x.platform):"")+'</span>':'<span class="badge" style="background:#fef3c7;color:#92400e">🟡 Ready</span>'}
function saveHistory(action){if(!cur)return;let a=getHistory(),item={id:Date.now(),link:cur.link,title:$("title").value.trim(),original:original,source:cur.source||"",category:cur.category||"",tool:"newsonly",action,status:"ready",createdAt:new Date().toISOString()};a=[item,...a.filter(x=>!(x.link===item.link&&x.tool===item.tool&&x.action===item.action))].slice(0,100);localStorage.setItem("iam_post_history",JSON.stringify(a));renderHistory()}
function renderHistory(){let a=getHistory().filter(x=>x.tool==="newsonly");$("historyList").innerHTML=a.length?a.slice(0,15).map(x=>'<div class="story" style="cursor:default"><div style="min-width:0;flex:1"><b>'+safe(x.title)+'</b><div class="muted">'+safe(x.source)+' • '+new Date(x.createdAt).toLocaleString("ne-NP")+'</div><div class="badges"><span class="badge">📝 '+safe(x.action)+'</span><span class="badge">'+safe(catNames[x.category]||x.category||"नेपाल")+'</span></div></div><button onclick="reuseHistory('+x.id+')">Reuse</button></div>').join(""):'<div class="muted">अहिलेसम्म कुनै पोस्ट तयार गरिएको छैन।</div>'}
function reuseHistory(id){let x=getHistory().find(v=>v.id===id);if(!x)return;let n=items.find(v=>v.link===x.link);if(n){pick(items.indexOf(n));$("title").value=x.title;preview();toast("History restored ✓")}else toast("Original news is no longer in live feed")}
function clearHistory(){if(!confirm("Post history clear गर्ने?"))return;localStorage.removeItem("iam_post_history");renderHistory();toast("History cleared")}
async function copyText(id){await navigator.clipboard.writeText(id==="preview"?$(id).textContent:$(id).value);saveHistory(id==="preview"?"Copy All":"Copy Headline");toast("Copied ✓")}
function copyPlatform(p){let h=$("title").value.trim(),tags=$("tags").value.trim(),s=p==="x"?(h+" "+tags).slice(0,280):p==="whatsapp"?h+"\n\n"+tags:p==="instagram"?h+"\n\n"+tags:"📰 "+h+"\n\n"+tags;navigator.clipboard.writeText(s);saveHistory(p+" format");toast(p+" format copied ✓")}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").style.display="none",1800)}
async function loadLive(){try{let r=await fetch("../../data/news.json?"+Date.now()),d=await r.json();items=d.items||[];let old=cur?.link;cur=old?items.find(x=>x.link===old):items[0];if(!cur)cur=items[0];if(cur){original=cur.title;$("title").value=$("title").value||cur.title;$("meta").textContent=(cur.source||"")+" • "+age(cur.published)}renderList();preview()}catch(e){console.error(e);toast("Live news load failed")}}
loadLive();renderHistory();setInterval(loadLive,5*60*1000);
</script></body></html>
