<!doctype html>
<html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Photo Editor — I Am From Hetauda</title>
<style>
:root{--bg:#080c18;--panel:#151c2f;--line:#29344d;--text:#f8fafc;--muted:#9aa6bd;--accent:#e11d48}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#263452,#080c18 48%);color:var(--text);font-family:system-ui,"Noto Sans Devanagari",sans-serif}.app{max-width:1550px;margin:auto;padding:9px}.bar,.panel{background:rgba(21,28,47,.9);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:15px;padding:9px;box-shadow:0 15px 45px #0005}.bar{display:flex;justify-content:space-between;gap:9px;align-items:center;margin-bottom:8px}.brand{display:flex;gap:8px;align-items:center}.logo{width:40px;height:40px;border-radius:11px}.muted{color:var(--muted);font-size:10px}.nav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.nav a{display:inline-flex;text-decoration:none;border:1px solid var(--line);background:#0f172a;color:#f8fafc;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:850}.nav a.active{background:var(--accent);border-color:var(--accent)}.workspace{display:grid;grid-template-columns:290px minmax(420px,1fr) 330px;gap:8px}.stories{max-height:calc(100vh - 90px);overflow:auto}.story{display:flex;gap:7px;padding:7px;margin:6px 0;text-align:left;cursor:pointer;border:1px solid transparent;border-radius:10px}.story.active{outline:2px solid var(--accent)}.story img{width:62px;height:56px;object-fit:cover;border-radius:7px;flex:none}.story b{font-size:10px;line-height:1.4}.search,input,textarea,select,button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:#0f172a;color:#f8fafc}button{cursor:pointer;font-weight:800}.primary{background:var(--accent);border-color:var(--accent)}.workspace>.panel:nth-child(2){min-width:0}.canvasbox{background:#050816;border-radius:12px;padding:7px;display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 125px);overflow:hidden}canvas{width:min(100%,820px);aspect-ratio:1;border-radius:7px;background:#222;touch-action:none}.tools{display:grid;gap:6px;max-height:calc(100vh - 90px);overflow:auto}.tool{border:1px solid var(--line);border-radius:10px;padding:8px}.tool label{display:block;font-size:9px;font-weight:850;margin-bottom:4px}.tool input,.tool select,.tool textarea{width:100%}.row{display:flex;gap:5px}.row>*{flex:1}.templates{display:grid;grid-template-columns:1fr 1fr;gap:4px}.rangeval{font-size:9px;color:var(--muted);float:right}.checks{display:grid;grid-template-columns:1fr 1fr;gap:4px}.toast{position:fixed;right:15px;bottom:15px;background:#fff;color:#111827;padding:10px 14px;border-radius:11px;display:none;z-index:100}@media(max-width:1100px){.workspace{grid-template-columns:250px 1fr}.right{grid-column:1/-1}.tools{grid-template-columns:repeat(3,1fr);max-height:none}}@media(max-width:700px){.workspace{display:flex;flex-direction:column}.stories{max-height:260px}.canvasbox{min-height:0}.tools{grid-template-columns:1fr 1fr}.bar{position:sticky;top:3px;z-index:20}}
</style></head><body><main class="app"><header class="bar"><div class="brand"><img class="logo" src="../../logo.jpg"><div><b>🎨 I Am From Hetauda — Photo Studio</b><div class="muted">1080×1080 • drag image/text • professional news templates</div></div></div><div class="row"><button onclick="location.href='../'">← Admin</button><button onclick="reset()">↺</button><button class="primary" onclick="copy()">📋 Copy</button><button onclick="download()">⬇️ PNG</button></div></header>
<nav class="nav"><a href="../">🗂️ Admin</a><a href="../newsonly/">📝 News Only</a><a href="../newswithimage/">🖼️ News With Image</a><a class="active" href="../photo-editor/">🎨 Photo Editor</a></nav>
<div class="workspace"><aside class="panel stories"><input id="q" class="search" placeholder="🔎 Search news…" oninput="renderList()" style="width:100%"><div class="row" style="margin-top:5px"><select id="cat" onchange="renderList()"><option value="">सबै</option><option value="politics">राजनीति</option><option value="business">अर्थतन्त्र</option><option value="society">समाज</option><option value="sports">खेलकुद</option><option value="tech">प्रविधि</option><option value="world">विश्व</option></select><select id="sort" onchange="renderList()"><option value="score">Best</option><option value="new">New</option><option value="local">Local</option></select></div><div id="list"></div></aside>
<section class="panel"><div class="canvasbox"><canvas id="cv" width="1080" height="1080"></canvas></div></section>
<aside class="panel right"><div class="tools">
<div class="tool"><label>Templates</label><div class="templates"><button onclick="tpl('clean')">Clean</button><button onclick="tpl('breaking')">Breaking</button><button onclick="tpl('dark')">Dark</button><button onclick="tpl('minimal')">Minimal</button><button onclick="tpl('lower')">Lower 3rd</button><button onclick="tpl('alert')">Alert</button><button onclick="tpl('local')">📍 Hetauda</button><button onclick="tpl('business')">💰 Business</button><button onclick="tpl('sports')">🏏 Sports</button><button onclick="tpl('tech')">💻 Tech</button></div></div>
<div class="tool"><label>Headline</label><textarea id="txt" rows="3" oninput="draw()"></textarea></div>
<div class="tool"><label>Font</label><select id="font" onchange="draw()"><option>Noto Sans Devanagari</option><option>system-ui</option><option>serif</option></select></div>
<div class="tool"><label>Font size <span class="rangeval" id="sv"></span></label><input id="size" type="range" min="24" max="100" value="58" oninput="draw()"></div>
<div class="tool"><label>Line spacing <span class="rangeval" id="spv"></span></label><input id="spacing" type="range" min="90" max="160" value="118" oninput="draw()"></div>
<div class="tool"><label>Headline Y <span class="rangeval" id="yv"></span></label><input id="y" type="range" min="60" max="900" value="650" oninput="draw()"></div>
<div class="tool"><label>Text width <span class="rangeval" id="wv"></span></label><input id="tw" type="range" min="400" max="1000" value="950" oninput="draw()"></div>
<div class="tool"><label>Image zoom <span class="rangeval" id="zv"></span></label><input id="zoom" type="range" min="50" max="300" value="100" oninput="draw()"></div>
<div class="tool"><label>Image X / Y</label><div class="row"><input id="ix" type="range" min="-600" max="600" value="0" oninput="draw()"><input id="iy" type="range" min="-600" max="600" value="0" oninput="draw()"></div></div>
<div class="tool"><label>Image filters</label><div class="row"><input id="bright" type="range" min="50" max="150" value="100" oninput="draw()"><input id="contrast" type="range" min="50" max="160" value="100" oninput="draw()"></div><div class="row" style="margin-top:4px"><input id="sat" type="range" min="0" max="180" value="100" oninput="draw()"><input id="blur" type="range" min="0" max="8" value="0" oninput="draw()"></div></div>
<div class="tool"><label>Overlay <span class="rangeval" id="ov"></span></label><input id="overlay" type="range" min="0" max="100" value="58" oninput="draw()"></div>
<div class="tool"><label>Text</label><div class="row"><input id="color" type="color" value="#ffffff" oninput="draw()"><input id="stroke" type="color" value="#000000" oninput="draw()"><input id="accent" type="color" value="#e11d48" oninput="draw()"></div><div class="row" style="margin-top:4px"><input id="strokeW" type="range" min="0" max="14" value="6" oninput="draw()"><input id="shadow" type="range" min="0" max="30" value="12" oninput="draw()"></div></div>
<div class="tool"><label>Text alignment / weight</label><div class="row"><select id="align" onchange="draw()"><option>left</option><option selected>center</option><option>right</option></select><select id="weight" onchange="draw()"><option>500</option><option>700</option><option selected>900</option></select></div></div>
<div class="tool"><label>Headline background</label><div class="checks"><button onclick="textBg=!textBg;draw()">Background</button><button onclick="textShadow=!textShadow;draw()">Shadow</button></div></div>
<div class="tool"><label>Logo</label><div class="row"><button onclick="logoOn=!logoOn;draw()">On / Off</button><button onclick="logoCorner=(logoCorner+1)%5;draw()">Position</button><button onclick="logoSize=logoSize>=1.8?.7:logoSize+.2;draw()">Size</button></div></div>
<div class="tool"><label>Export format</label><div class="row"><button onclick="setSize(1080,1080)">1:1</button><button onclick="setSize(1080,1350)">4:5</button><button onclick="setSize(1080,1920)">9:16</button></div><div class="row" style="margin-top:4px"><button onclick="setSize(1200,628)">FB</button><button onclick="setSize(1280,720)">YT</button><button onclick="setSize(1080,1080)">Square</button></div></div>
</div></aside></div></main><div id="toast" class="toast"></div>
<script>
let items=[],cur=null,im=null,logo=new Image(),logoOn=true,logoSize=1,logoCorner=0,mode="clean",textBg=false,textShadow=true,drag=null;$=id=>document.getElementById(id);logo.src="../../logo.jpg";logo.onload=draw;
function safe(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function renderList(){let q=$("q").value.toLowerCase(),cat=$("cat").value,a=items.filter(n=>(!q||(n.title+" "+(n.source||"")).toLowerCase().includes(q))&&(!cat||n.category===cat));if($("sort").value==="new")a.sort((a,b)=>new Date(b.published||0)-new Date(a.published||0));else if($("sort").value==="local")a.sort((a,b)=>(b.local?1:0)-(a.local?1:0)||(b.score||0)-(a.score||0));else a.sort((a,b)=>(b.score||0)-(a.score||0));$("list").innerHTML=a.map(n=>'<div class="story '+(n===cur?"active":"")+'" onclick="pick('+items.indexOf(n)+')">'+(n.image?'<img src="'+safe(n.image)+'">':"")+'<div><b>'+safe(n.title)+'</b><div class="muted">'+safe(n.source||"")+'</div></div></div>').join("")}
function pick(i){cur=items[i];$("txt").value=cur.title;loadImg();renderList()}
function loadImg(){im=new Image();im.crossOrigin="anonymous";im.onload=draw;im.onerror=draw;im.src=cur?.image||""}
function tpl(x){mode=x;draw()}
function setSize(w,h){$("cv").width=w;$("cv").height=h;draw();toast(w+"×"+h)}
function wrap(c,t,max){let a=[],l="";for(let w of t.trim().split(/\s+/)){let z=l?l+" "+w:w;if(c.measureText(z)>max&&l){a.push(l);l=w}else l=z}if(l)a.push(l);return a}
function draw(){let c=$("cv"),x=c.getContext("2d"),w=c.width,h=c.height;x.clearRect(0,0,w,h);if(im?.naturalWidth){let z=+$("zoom").value/100,r=Math.max(w/im.naturalWidth,h/im.naturalHeight)*z,nw=im.naturalWidth*r,nh=im.naturalHeight*r;x.save();x.filter="brightness("+$("bright").value+"%) contrast("+$("contrast").value+"%) saturate("+$("sat").value+"%) blur("+$("blur").value+"px)";x.drawImage(im,(w-nw)/2 + +$("ix").value,(h-nh)/2 + +$("iy").value,nw,nh);x.restore()}else{x.fillStyle="#334155";x.fillRect(0,0,w,h)}let o=+$("overlay").value/100,g=x.createLinearGradient(0,h*.25,0,h);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,"+o+")");x.fillStyle=g;x.fillRect(0,0,w,h);let ac=$("accent").value;if(mode==="dark"){x.fillStyle="rgba(0,0,0,.68)";x.fillRect(0,0,w,h)}if(["breaking","alert","local","business","sports","tech"].includes(mode)){x.fillStyle=ac;x.fillRect(0,0,w,15);x.fillRect(40,40,300,62);x.fillStyle="#fff";x.font="900 28px sans-serif";x.fillText(mode==="local"?"📍 HETAUDA":mode==="business"?"💰 BUSINESS":mode==="sports"?"🏏 SPORTS":mode==="tech"?"💻 TECH":mode==="alert"?"⚡ NEWS ALERT":"🚨 BREAKING",60,82)}if(mode==="minimal"){x.fillStyle="rgba(255,255,255,.92)";x.fillRect(45,h-320,w-90,275)}if(mode==="lower"){x.fillStyle="rgba(0,0,0,.84)";x.fillRect(0,h-350,w,350)}let sz=+$("size").value,lh=sz*(+$("spacing").value/100);x.font=$("weight").value+" "+sz+"px '"+$("font").value+"',sans-serif";x.textAlign=$("align").value;x.textBaseline="top";let xx=$("align").value==="left"?55:$("align").value==="right"?w-55:w/2,lines=wrap(x,$("txt").value,+$("tw").value);let yy=+$("y").value;if(textBg){x.fillStyle="rgba(0,0,0,.48)";x.fillRect(35,yy-15,w-70,lines.length*lh+30)}lines.forEach((l,i)=>{let py=yy+i*lh;if(textShadow){x.shadowColor="rgba(0,0,0,.65)";x.shadowBlur=+$("shadow").value}x.lineWidth=+$("strokeW").value;x.strokeStyle=$("stroke").value;x.strokeText(l,xx,py);x.fillStyle=$("color").value;x.fillText(l,xx,py);x.shadowBlur=0});if(logoOn&&logo.complete&&logo.naturalWidth){let s=110*logoSize,lx=38,ly=38;if(logoCorner===1){lx=w-s-38}else if(logoCorner===2){ly=h-s-38}else if(logoCorner===3){lx=w-s-38;ly=h-s-38}else if(logoCorner===4){lx=(w-s)/2;ly=(h-s)/2}x.globalAlpha=.92;x.drawImage(logo,lx,ly,s,s);x.globalAlpha=1}x.fillStyle=ac;x.fillRect(50,h-65,220,6);x.fillStyle="#fff";x.font="900 25px sans-serif";x.textAlign="left";x.fillText("I AM FROM HETAUDA",50,h-27);updateVals()}
function updateVals(){$("sv").textContent=$("size").value+"px";$("spv").textContent=$("spacing").value+"%";$("yv").textContent=$("y").value;$("wv").textContent=$("tw").value;$("zv").textContent=$("zoom").value+"%";$("ov").textContent=$("overlay").value+"%"}
$("cv").addEventListener("pointerdown",e=>{let r=$("cv").getBoundingClientRect();drag={x:e.clientX,y:e.clientY,ix:+$("ix").value,iy:+$("iy").value};$("cv").setPointerCapture(e.pointerId)});
$("cv").addEventListener("pointermove",e=>{if(!drag)return;let r=$("cv").getBoundingClientRect(),sx=$("cv").width/r.width,sy=$("cv").height/r.height;$("ix").value=Math.max(-600,Math.min(600,drag.ix+(e.clientX-drag.x)*sx));$("iy").value=Math.max(-600,Math.min(600,drag.iy+(e.clientY-drag.y)*sy));draw()});
$("cv").addEventListener("pointerup",()=>drag=null);$("cv").addEventListener("pointercancel",()=>drag=null);
async function copy(){try{$("cv").toBlob(async b=>{await navigator.clipboard.write([new ClipboardItem({"image/png":b})]);toast("Design copied ✓")},"image/png")}catch(e){toast("Copy unavailable")}}
function download(){let a=document.createElement("a");a.download="iamfromhetauda-news.png";a.href=$("cv").toDataURL("image/png");a.click()}
function reset(){["size","spacing","y","tw","zoom","ix","iy","bright","contrast","sat","blur","overlay"].forEach(id=>$(id).value={size:58,spacing:118,y:650,tw:950,zoom:100,ix:0,iy:0,bright:100,contrast:100,sat:100,blur:0,overlay:58}[id]);$("color").value="#ffffff";$("stroke").value="#000000";$("accent").value="#e11d48";$("strokeW").value=6;$("shadow").value=12;$("align").value="center";$("weight").value="900";$("font").value="Noto Sans Devanagari";mode="clean";textBg=false;textShadow=true;logoCorner=0;logoSize=1;draw()}
async function loadLive(){try{let r=await fetch("../../data/news.json?"+Date.now()),d=await r.json();items=d.items||[];cur=cur?.link?items.find(x=>x.link===cur.link)||items[0]:items[0];if(cur)$("txt").value=$("txt").value||cur.title;renderList();loadImg()}catch(e){console.error(e);toast("Live news load failed")}}
loadLive();setInterval(loadLive,5*60*1000);
</script></body></html>
