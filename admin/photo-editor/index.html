<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Advanced Photo Editor</title><style>:root{--bg:#0b1020;--panel:#151c2f;--line:#29344d;--text:#f8fafc;--muted:#9aa6bd;--accent:#e11d48}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#202b48,#0b1020 45%);color:var(--text);font-family:system-ui,"Noto Sans Devanagari",sans-serif}.app{max-width:1500px;margin:auto;padding:10px}.bar,.panel{background:rgba(21,28,47,.88);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 15px 50px #0005}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}.brand{display:flex;gap:9px;align-items:center}.logo{width:40px;height:40px;border-radius:11px}.muted{color:var(--muted);font-size:11px}.workspace{display:grid;grid-template-columns:300px minmax(400px,1fr) 310px;gap:10px}.stories{max-height:calc(100vh - 85px);overflow:auto}.search,.story{width:100%}input,textarea,select,button{font:inherit;border:1px solid var(--line);border-radius:9px;padding:9px;background:#0f172a;color:#f8fafc}button{cursor:pointer;font-weight:800}.primary{background:var(--accent);border-color:var(--accent)}.story{display:flex;gap:8px;padding:8px;margin:7px 0;text-align:left;cursor:pointer}.story.active{outline:2px solid var(--accent)}.story img{width:65px;height:60px;object-fit:cover;border-radius:8px;flex:none}.story b{font-size:11px;line-height:1.45}.canvasbox{background:#050816;border-radius:14px;padding:8px;display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 130px)}canvas{width:min(100%,780px);aspect-ratio:1;border-radius:8px;background:#222}.tools{display:grid;gap:8px}.tool{border:1px solid var(--line);border-radius:11px;padding:9px}.tool label{display:block;font-size:10px;font-weight:850;margin-bottom:4px}.tool input,.tool select,.tool textarea{width:100%}.row{display:flex;gap:5px}.row>*{flex:1}.templates{display:grid;grid-template-columns:1fr 1fr;gap:5px}@media(max-width:1050px){.workspace{grid-template-columns:250px 1fr}.right{grid-column:1/-1}.tools{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.workspace{display:flex;flex-direction:column}.stories{max-height:250px}.canvasbox{min-height:0}.tools{grid-template-columns:1fr 1fr}.bar{position:sticky;top:4px;z-index:10}}<style>.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.nav a{display:inline-flex;text-decoration:none;border:1px solid var(--line);background:#0f172a;color:#f8fafc;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:850}.nav a.active{background:var(--accent);border-color:var(--accent)}@media(max-width:700px){.nav{gap:4px}.nav a{font-size:9px;padding:6px 8px}}</style></style></head><body><main class="app"><header class="bar"><div class="brand"><img class="logo" src="../../logo.jpg"><div><b>🎨 Advanced Photo Editor</b><div class="muted">1080×1080 • original news image • full manual controls</div></div></div><div class="row"><button onclick="location.href='../'">← Admin</button><button class="primary" onclick="copy()">📋 Copy</button><button onclick="download()">⬇️ PNG</button></div></header><nav class="nav" aria-label="Admin tools"><a href="../">🗂️ Admin</a><a  href="../newsonly/">📝 News Only</a><a  href="../newswithimage/">🖼️ News With Image</a><a class="active" href="../photo-editor/">🎨 Photo Editor</a></nav><div class="workspace"><aside class="panel stories"><input id="q" class="search" placeholder="🔎 Search news…" oninput="list()"><button onclick="shuffle()" style="width:100%;margin-top:6px">🔀 Shuffle</button><div id="list"></div></aside><section class="panel"><div class="canvasbox"><canvas id="cv" width="1080" height="1080"></canvas></div></section><aside class="panel right"><div class="tools"><div class="tool"><label>Templates</label><div class="templates"><button onclick="tpl('clean')">Clean</button><button onclick="tpl('breaking')">Breaking</button><button onclick="tpl('dark')">Dark</button><button onclick="tpl('minimal')">Minimal</button><button onclick="tpl('lower')">Lower 3rd</button><button onclick="tpl('alert')">Alert</button></div></div><div class="tool"><label>Headline</label><textarea id="txt" rows="4" oninput="draw()"></textarea></div><div class="tool"><label>Font</label><select id="font" onchange="draw()"><option>Noto Sans Devanagari</option><option>system-ui</option><option>serif</option></select></div><div class="tool"><label>Font size</label><input id="size" type="range" min="24" max="100" value="58" oninput="draw()"></div><div class="tool"><label>Line spacing</label><input id="spacing" type="range" min="90" max="150" value="118" oninput="draw()"></div><div class="tool"><label>Headline Y</label><input id="y" type="range" min="80" max="900" value="650" oninput="draw()"></div><div class="tool"><label>Image zoom</label><input id="zoom" type="range" min="100" max="220" value="100" oninput="draw()"></div><div class="tool"><label>Image X</label><input id="ix" type="range" min="-400" max="400" value="0" oninput="draw()"></div><div class="tool"><label>Image Y</label><input id="iy" type="range" min="-400" max="400" value="0" oninput="draw()"></div><div class="tool"><label>Overlay</label><input id="overlay" type="range" min="0" max="100" value="58" oninput="draw()"></div><div class="tool"><label>Text color</label><input id="color" type="color" value="#ffffff" oninput="draw()"></div><div class="tool"><label>Accent</label><input id="accent" type="color" value="#e11d48" oninput="draw()"></div><div class="tool"><label>Alignment</label><select id="align" onchange="draw()"><option>left</option><option selected>center</option><option>right</option></select></div><div class="tool"><label>Weight</label><select id="weight" onchange="draw()"><option>500</option><option>700</option><option selected>900</option></select></div><div class="tool"><label>Logo</label><div class="row"><button onclick="logoOn=!logoOn;draw()">On / Off</button><button onclick="logoSize=logoSize>=1.8?.7:logoSize+.3;draw()">Size</button></div></div><div class="tool"><label>Reset</label><button onclick="reset()">↺ Reset all controls</button></div></div></aside></div></main><script>
let items=JSON.parse(localStorage.getItem("iam_selected_news")||"[]"),cur=items[0],im=null,logo=new Image(),logoOn=true,logoSize=1,mode="clean",$=id=>document.getElementById(id);logo.src="../../logo.jpg";logo.onload=draw;
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function list(){let q=$("q").value.toLowerCase(),a=items.filter(n=>(n.title+" "+(n.source||"")).toLowerCase().includes(q));$("list").innerHTML=a.map(n=>'<div class="story '+(n===cur?"active":"")+'" onclick="pick('+items.indexOf(n)+')">'+(n.image?'<img src="'+esc(n.image)+'">':"")+'<div><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.source||"")+'</div></div></div>').join("")}
function pick(i){cur=items[i];$("txt").value=cur.title;loadImg();list()}
function shuffle(){items.sort(()=>Math.random()-.5);pick(0)}
function loadImg(){im=new Image();im.crossOrigin="anonymous";im.onload=draw;im.onerror=draw;im.src=cur?.image||""}
function tpl(x){mode=x;draw()}
function wrap(c,t,max){let a=[],l="";for(let w of t.trim().split(/\s+/)){let z=l?l+" "+w:w;if(c.measureText(z).width>max&&l){a.push(l);l=w}else l=z}if(l)a.push(l);return a}
function draw(){let c=$("cv"),x=c.getContext("2d"),w=1080,h=1080;x.clearRect(0,0,w,h);if(im?.naturalWidth){let z=+$("zoom").value/100,r=Math.max(w/im.naturalWidth,h/im.naturalHeight)*z,nw=im.naturalWidth*r,nh=im.naturalHeight*r;x.drawImage(im,(w-nw)/2 + +$("ix").value,(h-nh)/2 + +$("iy").value,nw,nh)}else{x.fillStyle="#334155";x.fillRect(0,0,w,h)}let o=+$("overlay").value/100,g=x.createLinearGradient(0,350,0,h);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,"+o+")");x.fillStyle=g;x.fillRect(0,0,w,h);let ac=$("accent").value;if(mode==="dark"){x.fillStyle="rgba(0,0,0,.65)";x.fillRect(0,0,w,h)}if(mode==="breaking"||mode==="alert"){x.fillStyle=ac;x.fillRect(0,0,w,14);x.fillRect(45,45,270,64);x.fillStyle="#fff";x.font="900 30px sans-serif";x.fillText(mode==="breaking"?"🚨 BREAKING":"⚡ NEWS ALERT",65,87)}if(mode==="minimal"){x.fillStyle="rgba(255,255,255,.9)";x.fillRect(45,770,990,240)}if(mode==="lower"){x.fillStyle="rgba(0,0,0,.82)";x.fillRect(0,735,w,345)}if(logoOn&&logo.complete&&logo.naturalWidth){let s=110*logoSize;x.drawImage(logo,38,38,s,s)}let sz=+$("size").value;x.font=$("weight").value+" "+sz+"px '"+$("font").value+"',sans-serif";x.fillStyle=$("color").value;x.textAlign=$("align").value;x.textBaseline="top";let xx=$("align").value==="left"?55:$("align").value==="right"?1025:540,lines=wrap(x,$("txt").value,970),yy=+$("y").value,lh=sz*(+$("spacing").value/100);lines.forEach((l,i)=>{x.lineWidth=8;x.strokeStyle="rgba(0,0,0,.55)";x.strokeText(l,xx,yy+i*lh);x.fillText(l,xx,yy+i*lh)});x.fillStyle=ac;x.fillRect(50,h-70,220,6);x.fillStyle="#fff";x.font="900 27px sans-serif";x.textAlign="left";x.fillText("I AM FROM HETAUDA",50,h-32)}
async function copy(){try{$("cv").toBlob(async b=>{await navigator.clipboard.write([new ClipboardItem({"image/png":b})]);alert("Image copied ✓")},"image/png")}catch(e){alert("Copy unavailable")}}
function download(){let a=document.createElement("a");a.download="iamfromhetauda-news.png";a.href=$("cv").toDataURL("image/png");a.click()}
function reset(){["size","spacing","y","zoom","ix","iy","overlay"].forEach((id)=>$(id).value={size:58,spacing:118,y:650,zoom:100,ix:0,iy:0,overlay:58}[id]);$("color").value="#ffffff";$("accent").value="#e11d48";$("align").value="center";$("weight").value="900";$("font").value="Noto Sans Devanagari";mode="clean";draw()}
if(cur)$("txt").value=cur.title;list();loadImg();
</script></body></html>
