<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>News Photo Editor — I Am From Hetauda</title><style>
:root{--bg:#edf1f7;--ink:#101828;--muted:#667085;--line:#d0d5dd;--accent:#e11d48}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.app{max-width:1400px;margin:auto;padding:12px}.bar,.panel{background:rgba(255,255,255,.8);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:12px;box-shadow:0 10px 35px rgba(16,24,40,.08);margin-bottom:10px}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;gap:9px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;object-fit:cover}.muted{font-size:11px;color:var(--muted)}button,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:800}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.workspace{display:grid;grid-template-columns:310px minmax(360px,1fr) 290px;gap:10px}.stories{max-height:calc(100vh - 130px);overflow:auto}.search{width:100%;margin-bottom:7px}.story{display:flex;gap:8px;padding:8px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;background:#fff;cursor:pointer}.story.active{outline:2px solid var(--accent)}.story img{width:68px;height:68px;object-fit:cover;border-radius:9px}.story b{font-size:12px;line-height:1.45}.canvasbox{display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 180px);background:#dfe4ea;border-radius:16px;padding:10px}.canvasbox canvas{width:min(100%,760px);aspect-ratio:1/1;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);background:#fff}.tools{display:grid;gap:9px}.tool{padding:9px;border:1px solid var(--line);border-radius:12px;background:#fff}.tool label{display:block;font-size:11px;font-weight:800;margin-bottom:5px}.tool input[type=range]{width:100%;padding:0}.tool input[type=color]{width:100%;height:38px;padding:2px}.tool textarea{width:100%;resize:vertical}.swatches{display:flex;gap:5px;flex-wrap:wrap}.swatches button{width:30px;height:30px;padding:0;border-radius:50%}.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}.templates{display:grid;grid-template-columns:1fr 1fr;gap:5px}.templates button{font-size:10px}.footer{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:1050px){.workspace{grid-template-columns:250px minmax(330px,1fr)}.right{grid-column:1/-1}.tools{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.app{padding:6px}.workspace{display:flex;flex-direction:column}.stories{max-height:250px}.canvasbox{min-height:0;padding:5px}.canvasbox canvas{width:min(100%,520px)}.right{order:3}.tools{grid-template-columns:1fr 1fr}.bar{position:sticky;top:5px;z-index:10}.tool{padding:8px}.story img{width:58px;height:58px}.templates{grid-template-columns:1fr 1fr}}</style></head><body><main class="app">
<header class="bar"><div class="brand"><img class="logo" src="../logo.jpg"><div><b>🎨 I Am From Hetauda — News Photo Editor</b><div class="muted">1:1 professional news template • live news selection • manual editing</div></div></div><div class="footer"><button onclick="shuffle()">🔀 Shuffle</button><button onclick="load()">↻ Refresh</button><button class="primary" onclick="copyImage()">📋 Copy Image</button><button onclick="downloadImage()">⬇️ PNG</button></div></header>
<div class="workspace"><aside class="panel stories"><input id="q" class="search" placeholder="🔎 समाचार खोज्नुहोस्…" oninput="renderStories()"><div class="row"><button onclick="shuffle()">🔀 Shuffle</button><button onclick="randomStory()">🎲 Random</button></div><div id="storyList" style="margin-top:7px"></div></aside>
<section class="panel"><div class="canvasbox"><canvas id="cv" width="1080" height="1080"></canvas></div></section>
<aside class="panel right"><div class="tools">
<div class="tool"><label>Templates</label><div class="templates"><button onclick="template('clean')">Clean</button><button onclick="template('breaking')">Breaking</button><button onclick="template('dark')">Dark</button><button onclick="template('lower')">Lower 3rd</button></div></div>
<div class="tool"><label>Headline</label><textarea id="txt" rows="4" oninput="draw()"></textarea></div>
<div class="tool"><label>Text color</label><input id="color" type="color" value="#ffffff" oninput="draw()"><div class="swatches"><button style="background:#fff" onclick="setColor('#ffffff')"></button><button style="background:#111827" onclick="setColor('#111827')"></button><button style="background:#e11d48" onclick="setColor('#e11d48')"></button><button style="background:#fbbf24" onclick="setColor('#fbbf24')"></button></div></div>
<div class="tool"><label>Headline size</label><input id="size" type="range" min="28" max="100" value="58" oninput="draw()"></div>
<div class="tool"><label>Headline Y position</label><input id="y" type="range" min="180" max="930" value="700" oninput="draw()"></div>
<div class="tool"><label>Overlay</label><input id="overlay" type="range" min="0" max="90" value="60" oninput="draw()"></div>
<div class="tool"><label>Alignment</label><select id="align" onchange="draw()"><option value="left">Left</option><option value="center" selected>Center</option><option value="right">Right</option></select></div>
<div class="tool"><label>Brand logo</label><div class="row"><button onclick="toggleLogo()">Logo On/Off</button><button onclick="logoSize()">Logo Size</button></div></div>
<div class="tool"><label>Brand accent</label><input id="accent" type="color" value="#e11d48" oninput="draw()"></div>
<div class="tool"><label>Font weight</label><select id="weight" onchange="draw()"><option value="700">Bold</option><option value="900" selected>Extra Bold</option><option value="500">Medium</option></select></div>
<div class="tool"><label>Quick design</label><div class="row"><button onclick="setText('white')">White</button><button onclick="setText('accent')">Accent</button></div></div>
</div></aside></div></main>
<script>
let news=[],current=null,logoImg=new Image(),logoOn=true,logoScale=1,mode="clean";const $=id=>document.getElementById(id);
logoImg.src="../logo.jpg";logoImg.onload=draw;
function load(){fetch("../data/news.json?"+Date.now()).then(r=>r.json()).then(d=>{news=d.items||[];renderStories();if(!current&&news[0])select(news[0])}).catch(()=>{})}
function renderStories(){let q=$("q").value.toLowerCase();let a=news.filter(n=>(n.title+" "+(n.description||"")).toLowerCase().includes(q));$("storyList").innerHTML=a.slice(0,80).map(n=>'<div class="story '+(current===n?"active":"")+'" onclick="selectByLink('+JSON.stringify(n.link)+')">'+(n.image?'<img src="'+esc(n.image)+'">':'<div style="width:68px"></div>')+'<div><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.source||"")+' • '+esc(n.category||"")+'</div></div></div>').join("")}
function selectByLink(l){let n=news.find(x=>x.link===l);if(n)select(n)}
function select(n){current=n;$("txt").value=n.title||"";renderStories();draw()}
function shuffle(){news.sort(()=>Math.random()-.5);renderStories()}
function randomStory(){if(news.length)select(news[Math.floor(Math.random()*news.length)])}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function setColor(c){$("color").value=c;draw()}function toggleLogo(){logoOn=!logoOn;draw()}function logoSize(){logoScale=logoScale>=1.6?.7:logoScale+.3;draw()}
function setText(x){$("color").value=x==="accent"?$("accent").value:"#ffffff";draw()}
function template(x){mode=x;let vals={clean:["clean",60],breaking:["breaking",68],dark:["dark",62],lower:["lower",58]}[x];$("overlay").value=vals[1];draw()}
function wrapText(ctx,text,max){let words=text.trim().split(/\s+/),lines=[],line="";for(let w of words){let t=line?line+" "+w:w;if(ctx.measureText(t).width>max&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);return lines}
function draw(){let c=$("cv"),x=c.getContext("2d"),w=c.width,h=c.height;x.clearRect(0,0,w,h);if(current&&current.image){let im=new Image();im.crossOrigin="anonymous";im.onload=()=>paint(x,w,h,im);im.src=current.image}else paint(x,w,h,null)}
function paint(x,w,h,im){x.fillStyle="#d1d5db";x.fillRect(0,0,w,h);if(im){let r=Math.max(w/im.naturalWidth,h/im.naturalHeight),nw=im.naturalWidth*r,nh=im.naturalHeight*r;x.drawImage(im,(w-nw)/2,(h-nh)/2,nw,nh)}let ac=$("accent").value,ov=+$("overlay").value/100;if(mode==="dark"){x.fillStyle="rgba(0,0,0,.72)";x.fillRect(0,0,w,h)}else{let g=x.createLinearGradient(0,h*.42,0,h);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,"+ov+")");x.fillStyle=g;x.fillRect(0,0,w,h)}if(mode==="breaking"){x.fillStyle=ac;x.fillRect(0,0,w,86);x.fillStyle="#fff";x.font="900 34px sans-serif";x.fillText("BREAKING NEWS",42,55)}if(mode==="lower"){x.fillStyle=ac;x.fillRect(0,760,w,320)}if(logoOn&&logoImg.complete&&logoImg.naturalWidth){let s=120*logoScale;x.drawImage(logoImg,38,38,s,s)}let size=+$("size").value;x.font=$("weight").value+" "+size+"px 'Noto Sans Devanagari',sans-serif";x.fillStyle=$("color").value;x.textAlign=$("align").value;x.textBaseline="top";let xx=$("align").value==="left"?55:$("align").value==="right"?w-55:w/2,lines=wrapText(x,$("txt").value,w-110),yy=+$("y").value;lines.forEach((l,i)=>{x.lineWidth=7;x.strokeStyle="rgba(0,0,0,.55)";x.strokeText(l,xx,yy+i*size*1.2);x.fillText(l,xx,yy+i*size*1.2)});x.font="800 27px sans-serif";x.textAlign="left";x.fillStyle="#fff";x.fillText("I AM FROM HETAUDA",45,h-48);x.fillStyle=ac;x.fillRect(45,h-35,250,5)}
async function copyImage(){ $("cv").toBlob(async b=>{if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({"image/png":b})]);toast("Image copied ✓")}else toast("Image copy unavailable")},"image/png")}
function downloadImage(){let a=document.createElement("a");a.download="iamfromhetauda-news.png";a.href=$("cv").toDataURL("image/png");a.click()}
function toast(s){let d=document.createElement("div");d.textContent=s;d.style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 15px;border-radius:999px;z-index:50;font-weight:800";document.body.appendChild(d);setTimeout(()=>d.remove(),1500)}
load();
</script></body></html>
