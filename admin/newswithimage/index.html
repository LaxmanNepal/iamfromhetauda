<!doctype html>
<html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>News With Image — I Am From Hetauda</title>
<style>
:root{--bg:#eef2f7;--ink:#101828;--muted:#667085;--line:#d0d5dd;--accent:#e11d48;--dark:#111827}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;background:radial-gradient(circle at 0 0,#fff,transparent 35%),#eef2f7}.wrap{max-width:1300px;margin:auto;padding:12px}.box{background:rgba(255,255,255,.84);backdrop-filter:blur(20px);border:1px solid #fff;border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:0 12px 35px #10182812}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:13px;object-fit:cover}.eyebrow{font-size:10px;color:var(--accent);font-weight:900}.muted{color:var(--muted);font-size:11px}button,input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;color:var(--ink)}button{cursor:pointer;font-weight:800}.primary{background:var(--dark);color:#fff}.accent{background:var(--accent);color:#fff;border-color:var(--accent)}.actions{display:flex;gap:6px;flex-wrap:wrap}.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.nav a{display:inline-flex;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 10px;font-size:10px;font-weight:850}.nav a.active{background:var(--dark);color:#fff}.grid{display:grid;grid-template-columns:360px 1fr;gap:10px}.stories{max-height:calc(100vh - 140px);overflow:auto}.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.story{display:flex;gap:8px;padding:9px;border:1px solid var(--line);border-radius:14px;margin:7px 0;background:#fff;cursor:pointer}.story.active{outline:2px solid var(--accent)}.story img{width:80px;height:62px;object-fit:cover;border-radius:9px;flex:none}.story b{font-size:12px;line-height:1.45}.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.badge{font-size:9px;padding:2px 5px;border-radius:999px;background:#eef2ff}.local{background:#dcfce7;color:#166534}.ver{background:#dbeafe;color:#1d4ed8}.preview{border-radius:18px;background:#e5e7eb;min-height:430px;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview img{width:100%;max-height:680px;object-fit:contain}.label{font-size:11px;font-weight:850;display:grid;gap:5px}.label>*{width:100%}.toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:50}@media(max-width:800px){.grid{grid-template-columns:1fr}.stories{max-height:330px}.wrap{padding:7px}}
</style></head><body><main class="wrap">
<section class="box"><div class="top"><div class="brand"><img class="logo" src="../../logo.jpg"><div><div class="eyebrow">NEWS WITH IMAGE</div><h1 style="margin:2px 0;font-size:21px">🖼️ Image Post Studio</h1><div class="muted">Original/high-resolution feed image + editable headline</div></div></div><div class="actions"><button onclick="location.href='../'">← Admin</button><button onclick="loadLive()">↻</button></div></div></section>
<nav class="nav"><a href="../">🗂️ Admin</a><a href="../newsonly/">📝 News Only</a><a class="active" href="../newswithimage/">🖼️ News With Image</a><a href="../photo-editor/">🎨 Photo Editor</a></nav>
<section class="grid"><aside class="box stories"><input id="q" placeholder="🔎 Search news…" oninput="renderList()" style="width:100%"><div class="filters"><select id="cat" onchange="renderList()"><option value="">सबै category</option><option value="nepal">नेपाल</option><option value="politics">राजनीति</option><option value="business">अर्थतन्त्र</option><option value="society">समाज</option><option value="sports">खेलकुद</option><option value="tech">प्रविधि</option><option value="world">विश्व</option></select><select id="sort" onchange="renderList()"><option value="score">Best ranked</option><option value="new">Newest</option><option value="local">Hetauda first</option><option value="verified">Verified first</option></select></div><div class="actions" style="margin-top:7px"><button onclick="selectTop(5)">⭐ Top 5</button><button onclick="selectTop(8)">⭐ Top 8</button></div><div id="list"></div></aside>
<section><div class="box"><div class="actions" style="margin-bottom:8px"><button onclick="cleanTitle()">✨ Clean</button><button onclick="breaking()">🚨 Breaking</button><button onclick="location.href='../photo-editor/'">🎨 Edit Design</button></div><label class="label">Headline<textarea id="title" rows="3" oninput="renderText()"></textarea></label><div class="actions" style="margin-top:9px"><button class="accent" onclick="copyHeadline()">📋 Headline</button><button onclick="copyImage()">🖼️ Copy Image</button><button class="primary" onclick="copyBoth()">📦 Copy Both</button><button onclick="downloadOriginal()">⬇️ Original</button></div></div>
<div class="box"><div class="top"><b>Image Preview</b><span class="muted" id="meta"></span></div><div class="preview" style="margin-top:8px"><img id="hero" crossorigin="anonymous"></div><h2 id="out" style="line-height:1.5"></h2></div></section></section></main><div id="toast" class="toast"></div>
<script>
let items=[],cur=null,selectedLinks=new Set(JSON.parse(localStorage.getItem("iam_news_selected_links")||"[]"));const $=id=>document.getElementById(id);
function safe(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function age(t){if(!t)return"";let h=Math.max(0,(Date.now()-new Date(t).getTime())/36e5);return h<1?Math.round(h*60)+"m":h<24?Math.round(h)+"h":Math.round(h/24)+"d"}
function renderList(){let q=$("q").value.toLowerCase(),cat=$("cat").value,a=items.filter(n=>(!q||(n.title+" "+(n.source||"")+" "+(n.description||"")).toLowerCase().includes(q))&&(!cat||n.category===cat));let s=$("sort").value;if(s==="new")a.sort((a,b)=>new Date(b.published||0)-new Date(a.published||0));else if(s==="local")a.sort((a,b)=>(b.local?1:0)-(a.local?1:0)||(b.score||0)-(a.score||0));else if(s==="verified")a.sort((a,b)=>(b.verified?1:0)-(a.verified?1:0)||(b.score||0)-(a.score||0));else a.sort((a,b)=>(b.score||0)-(a.score||0));$("list").innerHTML=a.map(n=>'<div class="story '+(n===cur?"active":"")+'" onclick="pick('+items.indexOf(n)+')">'+(n.image?'<img src="'+safe(n.image)+'">':"")+'<div><b>'+safe(n.title)+'</b><div class="muted">'+safe(n.source||"")+" • "+age(n.published)+'</div><div class="badges">'+(n.local?'<span class="badge local">📍 Hetauda</span>':"")+(n.verified?'<span class="badge ver">✓ Verified</span>':"")+(selectedLinks.has(n.link)?'<span class="badge">✓ Selected</span>':"")+'</div></div></div>').join("")||'<div class="muted">समाचार भेटिएन।</div>'}
function pick(i){cur=items[i];selectedLinks.add(cur.link);localStorage.setItem("iam_news_selected_links",JSON.stringify([...selectedLinks].slice(-100)));$("title").value=cur.title;$("meta").textContent=(cur.source||"")+" • "+age(cur.published);refresh();renderList()}
function selectTop(n){renderList();let a=[...items].sort((x,y)=>(y.score||0)-(x.score||0)).slice(0,n);a.forEach(x=>selectedLinks.add(x.link));localStorage.setItem("iam_news_selected_links",JSON.stringify([...selectedLinks].slice(-100)));renderList();toast(n+" news selected ✓")}
function cleanTitle(){$("title").value=$("title").value.replace(/^["“”]+|["“”]+$/g,"").replace(/\s+/g," ").trim();renderText();toast("Cleaned ✓")}
function breaking(){if(!$("title").value.startsWith("🚨"))$("title").value="🚨 ब्रेकिङ: "+$("title").value;renderText()}
function renderText(){$("out").textContent=$("title").value}
function toast(s){$("toast").textContent=s;$("toast").style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").style.display="none",1800)}
async function copyHeadline(){await navigator.clipboard.writeText($("title").value);toast("Headline copied ✓")}
async function copyImage(){try{let r=await fetch(cur.image,{mode:"cors"});let b=await r.blob();await navigator.clipboard.write([new ClipboardItem({[b.type||"image/jpeg"]:b})]);toast("Image copied ✓")}catch(e){toast("Source blocks direct image copy — use Original or Photo Editor")}}
async function copyBoth(){await copyHeadline();setTimeout(copyImage,150)}
function downloadOriginal(){if(cur?.image)window.open(cur.image,"_blank")}
function refresh(){$("hero").src=cur?.image||"";renderText()}
async function loadLive(){try{let r=await fetch("../../data/news.json?"+Date.now()),d=await r.json();items=d.items||[];cur=cur?.link?items.find(x=>x.link===cur.link)||items[0]:items[0];if(cur){$("title").value=$("title").value||cur.title;$("meta").textContent=(cur.source||"")+" • "+age(cur.published)}renderList();refresh()}catch(e){toast("Live news load failed")}}
loadLive();setInterval(loadLive,5*60*1000);
</script></body></html>
