<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private News Desk</title><style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,"Noto Sans Devanagari",sans-serif}.wrap{max-width:900px;margin:auto;padding:30px 18px}.box{background:#111c31;border:1px solid #334155;border-radius:18px;padding:22px;margin-bottom:18px}input,button{font:inherit;border-radius:10px;border:1px solid #475569;padding:11px;background:#0b1220;color:#fff}input[type=password]{width:100%;box-sizing:border-box}button{cursor:pointer;background:#dc2626;border-color:#dc2626;font-weight:700}.muted{color:#94a3b8;font-size:13px}.hidden{display:none}.item{padding:14px 0;border-bottom:1px solid #263449}.title{font-weight:750;line-height:1.5}.source{color:#fca5a5;font-size:12px}.copy{background:#020617;border-radius:12px;padding:16px;white-space:pre-wrap;line-height:1.7;min-height:180px}</style></head><body><div class="wrap"><div class="box" id="login"><h1>🔐 Private News Desk</h1><p class="muted">आजको I Am From Hetauda news copy तयार गर्ने ठाउँ।</p><input id="pw" type="password" placeholder="Passcode"><br><br><button onclick="unlock()">Open</button><p id="err" class="muted"></p></div><div id="desk" class="hidden"><div class="box"><h1>🇳🇵 आजको समाचार डेस्क</h1><p class="muted">हेडलाइन मात्र प्रयोग गर्नुहोस् र मूल स्रोतको लिंक राख्नुहोस्।</p><button onclick="generate()">Generate</button> <button onclick="copyPost()">Copy</button></div><div class="box"><h2>समाचार छान्नुहोस्</h2><div id="items"></div></div><div class="box"><h2>Copy-ready post</h2><div id="copy" class="copy">Generate थिच्नुहोस्।</div></div></div></div><script>
var data=null;
async function unlock(){var p=document.getElementById("pw").value;var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(p));var h=[...new Uint8Array(b)].map(function(x){return x.toString(16).padStart(2,"0")}).join("");if(h==="5e884898da28047151e0d56f8dc6292773603d0d6aabbdd0d1f8b3f6b6b1a9"){document.getElementById("login").classList.add("hidden");document.getElementById("desk").classList.remove("hidden");load()}else document.getElementById("err").textContent="Passcode गलत छ।"}
function load(){fetch("./data/news.json?"+Date.now()).then(function(r){return r.json()}).then(function(d){data=d;document.getElementById("items").innerHTML=(d.items||[]).slice(0,40).map(function(n,i){return '<div class="item"><label><input type="checkbox" data-i="'+i+'"> <span class="source">'+n.source+'</span></label><div class="title">'+n.title+'</div></div>'}).join("")})}
function generate(){var chosen=[...document.querySelectorAll("input[type=checkbox]:checked")].map(function(x){return data.items[+x.dataset.i]});if(!chosen.length)chosen=(data.items||[]).slice(0,8);var s="🇳🇵 आजका प्रमुख समाचार\n\n";chosen.forEach(function(n,i){s+=(i+1)+". "+n.title+"\nस्रोत: "+n.source+"\n"+n.link+"\n\n"});s+="— I Am From Hetauda\nताजा अपडेटका लागि फलो/सब्सक्राइब गर्नुहोस्।";document.getElementById("copy").textContent=s}
function copyPost(){navigator.clipboard.writeText(document.getElementById("copy").textContent).then(function(){alert("Copied!")})}
</script></body></html>
