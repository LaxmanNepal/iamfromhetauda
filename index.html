<!doctype html>
<html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I Am From Hetauda — ताजा नेपाली समाचार</title>
<link rel="icon" type="image/jpeg" href="./logo.jpg"><meta name="description" content="नेपालका विभिन्न विश्वसनीय समाचार स्रोतका ताजा हेडलाइन">
<style>
:root{--bg:#eef3f8;--ink:#0b1220;--muted:#64748b;--glass:rgba(255,255,255,.58);--stroke:rgba(255,255,255,.72);--shadow:0 18px 55px rgba(31,41,55,.12);--accent:#e11d48}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans Devanagari",sans-serif;background:radial-gradient(circle at 10% 0%,#fff 0,#eef3f8 42%,#e5ebf3 100%);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 90% 10%,rgba(59,130,246,.10),transparent 28%),radial-gradient(circle at 10% 80%,rgba(236,72,153,.08),transparent 30%);z-index:-1}
.wrap{max-width:1180px;margin:auto;padding-left:18px;padding-right:18px}
header{position:sticky;top:10px;z-index:50;margin:10px auto 0;max-width:1180px;background:rgba(255,255,255,.64);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--stroke);border-radius:26px;box-shadow:var(--shadow);color:var(--ink)}
.head{padding:13px 16px 10px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:22px;letter-spacing:-.3px}.brand img{width:43px;height:43px;border-radius:14px;object-fit:cover;border:2px solid rgba(255,255,255,.9);box-shadow:0 5px 18px #0002}.brand b{color:var(--accent)}.sub{font-size:11px;color:var(--muted);margin-top:2px}.live{font-size:11px;font-weight:800;white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:5px;box-shadow:0 0 0 5px #ef444422}
nav{display:flex;gap:7px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{border:1px solid rgba(15,23,42,.08);background:rgba(255,255,255,.45);color:#334155;padding:8px 14px;border-radius:999px;white-space:nowrap;cursor:pointer;font-weight:700;transition:.18s}nav button:hover{transform:translateY(-1px);background:#fff}nav button.active{background:#111827;color:#fff;border-color:#111827;box-shadow:0 6px 16px #11182722}
main{padding:24px 18px 40px}.hero{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--stroke);border-radius:28px;padding:25px;box-shadow:var(--shadow);margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:30px;letter-spacing:-.7px}.hero p{margin:0;color:var(--muted);font-size:14px}.status{display:flex;justify-content:space-between;align-items:center;margin:18px 3px 12px}.updated{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:rgba(255,255,255,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--stroke);border-radius:24px;overflow:hidden;box-shadow:0 12px 35px rgba(31,41,55,.09);cursor:pointer;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-4px);box-shadow:0 22px 50px rgba(31,41,55,.15)}.thumb{width:100%;height:190px;object-fit:cover;display:block;background:#dbe3ec}.cardbody{padding:15px 17px 18px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}.source{color:#be123c;font-weight:800}.verified{background:#ecfdf5;color:#047857;padding:3px 7px;border-radius:999px;font-weight:750}.title{font-size:18px;line-height:1.48;margin:9px 0 0}.tap{font-size:11px;color:#94a3b8;margin-top:8px}.empty{grid-column:1/-1;text-align:center;background:var(--glass);backdrop-filter:blur(18px);padding:45px;border-radius:22px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{width:min(820px,100%);max-height:92vh;overflow:auto;background:rgba(255,255,255,.86);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);border:1px solid #fff;border-radius:30px;box-shadow:0 30px 90px #0005;position:relative}.modalimg{width:100%;max-height:390px;object-fit:cover;border-radius:30px 30px 0 0;background:#dbe3ec}.modalbody{padding:23px}.close{position:absolute;right:14px;top:14px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(15,23,42,.72);color:#fff;font-size:22px;cursor:pointer}.modalmeta{font-size:12px;color:var(--muted);margin-bottom:9px}.modal h2{font-size:26px;line-height:1.4;margin:0 0 13px}.description{font-size:15px;line-height:1.85;color:#334155;white-space:pre-wrap}.original{display:inline-block;margin-top:20px;background:#111827;color:#fff;text-decoration:none;padding:12px 18px;border-radius:14px;font-weight:800}.note{font-size:11px;color:#94a3b8;margin-top:10px}
footer{text-align:center;padding:30px 18px 45px;color:#64748b;font-size:11px;line-height:1.8}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){header{top:5px;margin-top:5px;border-radius:22px}.grid{grid-template-columns:1fr}.hero{padding:21px;border-radius:24px}.hero h1{font-size:24px}.brand{font-size:19px}.brand img{width:38px;height:38px}.modal h2{font-size:21px}.modalbody{padding:18px}.modalimg{max-height:280px}}
</style></head>
<body>
<header><div class="head"><div class="top"><div><div class="brand"><img src="./logo.jpg" alt="I Am From Hetauda logo"><span>I Am From <b>Hetauda</b></span></div><div class="sub">नेपालका ताजा समाचार — सरल, छिटो र स्रोतसहित</div></div><div class="live"><span class="dot"></span>LIVE</div></div><nav id="nav" aria-label="समाचार श्रेणी"></nav></div></header>
<main class="wrap"><section class="hero"><h1>नेपालका ताजा समाचार 🇳🇵</h1><p>हेडलाइन र फोटो मात्र देखाइएको छ। समाचारमा ट्याप गर्दा विस्तृत विवरण खुल्छ।</p></section><div class="status"><strong id="heading">ताजा समाचार</strong><span class="updated" id="updated">लोड हुँदैछ…</span></div><section class="grid" id="news"></section></main>
<div class="modal" id="modal"><div class="modalbox" role="dialog" aria-modal="true"><button class="close" onclick="closeModal()" aria-label="Close">×</button><img id="mi" class="modalimg" alt=""><div class="modalbody"><div id="mm" class="modalmeta"></div><h2 id="mt"></h2><div id="md" class="description"></div><a id="ml" class="original" target="_blank" rel="noopener">मूल समाचार साइटमा जानुहोस् →</a><div class="note">विस्तृत/मूल सामग्रीका लागि सम्बन्धित प्रकाशकको वेबसाइट खोल्नुहोस्।</div></div></div></div>
<footer id="sources"></footer>
<script>
var cats=[["all","सबै"],["nepal","नेपाल"],["politics","राजनीति"],["business","अर्थतन्त्र"],["society","समाज"],["sports","खेलकुद"],["tech","प्रविधि"],["world","विश्व"]],all=[],active="all";
cats.forEach(function(c,i){var b=document.createElement("button");b.textContent=c[1];if(!i)b.className="active";b.onclick=function(){active=c[0];document.querySelectorAll("nav button").forEach(function(x){x.classList.remove("active")});b.classList.add("active");document.getElementById("heading").textContent=c[1]==="सबै"?"ताजा समाचार":c[1]+" समाचार";render()};document.getElementById("nav").appendChild(b)});
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}
function ago(x){var d=(Date.now()-new Date(x).getTime())/60000;if(!isFinite(d))return "";if(d<60)return Math.max(1,Math.floor(d))+" मिनेट अघि";if(d<1440)return Math.floor(d/60)+" घण्टा अघि";return Math.floor(d/1440)+" दिन अघि"}
function render(){var a=active==="all"?all:all.filter(function(n){return n.category===active});var box=document.getElementById("news");if(!a.length){box.innerHTML='<div class="empty">यो श्रेणीमा अहिले समाचार भेटिएन।</div>';return}box.innerHTML=a.map(function(n,i){return '<article class="card" onclick="openNews('+i+')">'+(n.image?'<img class="thumb" loading="lazy" onerror="this.style.display=\'none\'" src="'+esc(n.image)+'" alt="">':'')+'<div class="cardbody"><div class="meta"><span><span class="source">'+esc(n.source)+'</span>'+(n.verified?'<span class="verified">✓ '+esc(n.source_count)+' स्रोत</span>':'')+'</span><span>'+ago(n.published)+'</span></div><h2 class="title">'+esc(n.title)+'</h2><div class="tap">ट्याप गरेर पूरा विवरण हेर्नुहोस् →</div></div></article>'}).join("")}
function openNews(i){var a=active==="all"?all:all.filter(function(n){return n.category===active});var n=a[i];if(!n)return;document.getElementById("mi").style.display=n.image?"block":"none";document.getElementById("mi").src=n.image||"";document.getElementById("mi").alt=n.title||"";document.getElementById("mm").textContent=n.source+" • "+ago(n.published)+(n.verified?" • "+n.source_count+" स्रोत":"");document.getElementById("mt").textContent=n.title;document.getElementById("md").textContent=n.description||"यस समाचारको थप विवरणका लागि मूल समाचार साइट खोल्नुहोस्।";document.getElementById("ml").href=n.link;document.getElementById("modal").classList.add("open");document.body.style.overflow="hidden"}
function closeModal(){document.getElementById("modal").classList.remove("open");document.body.style.overflow=""}
document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal()});document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
function load(){fetch("./data/news.json?"+Date.now()).then(function(r){return r.json()}).then(function(d){all=d.items||[];document.getElementById("updated").textContent="अन्तिम अपडेट: "+new Date(d.updated_at).toLocaleString("ne-NP");document.getElementById("sources").textContent="स्रोतहरू: "+(d.sources||[]).join(" • ");render()}).catch(function(){document.getElementById("news").innerHTML='<div class="empty">समाचार डेटा अहिले उपलब्ध भएन।</div>'})}load();setInterval(load,300000);
</script></body></html>
