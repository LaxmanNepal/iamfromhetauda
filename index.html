<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I Am From Hetauda — ताजा नेपाली समाचार</title><link rel="icon" type="image/jpeg" href="./logo.jpg"><meta name="description" content="नेपालका विभिन्न विश्वसनीय समाचार स्रोतका ताजा हेडलाइन"><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#64748b;--line:#e5e7eb;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}header{background:#0f172a;color:#fff;padding:24px 18px;position:sticky;top:0;z-index:5}.wrap{max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px}.brand{font-size:25px;font-weight:800;display:flex;align-items:center;gap:10px}.brand img{width:48px;height:48px;object-fit:cover;border-radius:50%;background:#fff;border:2px solid #fff}.brand b{color:#f87171}.sub{font-size:13px;color:#cbd5e1;margin-top:4px}.live{font-size:12px;color:#fecaca}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:5px}nav{display:flex;gap:7px;overflow:auto;margin-top:18px}nav button{border:1px solid #ffffff25;background:#ffffff0d;color:#e2e8f0;padding:8px 13px;border-radius:999px;white-space:nowrap}nav button.active{background:#fff;color:#111827}main{padding:24px 18px}.status{display:flex;justify-content:space-between;margin-bottom:18px}.updated{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 3px 14px #0f172a0a}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.source{color:#b91c1c;font-weight:700}.title{font-size:18px;line-height:1.5;margin:10px 0}.title a{color:inherit;text-decoration:none}.desc{font-size:13px;line-height:1.6;color:#475569}.read{display:inline-block;margin-top:12px;color:#b91c1c;font-size:12px;font-weight:700;text-decoration:none}.empty{grid-column:1/-1;text-align:center;background:#fff;padding:45px;border-radius:16px;color:var(--muted)}footer{text-align:center;padding:35px 18px;color:#64748b;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.brand{font-size:21px}}
</style></head><body><header><div class="wrap"><div class="top"><div><div class="brand"><img src="./logo.jpg" alt="I Am From Hetauda logo"> <span>I Am From <b>Hetauda</b></span></div><div class="sub">नेपालका ताजा समाचार — सरल, छिटो र स्रोतसहित</div></div><div class="live"><span class="dot"></span>LIVE FEED</div></div><nav id="nav"></nav></div></header><main class="wrap"><div class="status"><strong id="heading">ताजा समाचार</strong><span class="updated" id="updated">लोड हुँदैछ…</span></div><section class="grid" id="news"></section></main><footer id="sources"></footer><script>
var cats=[["all","सबै"],["nepal","नेपाल"],["politics","राजनीति"],["business","अर्थतन्त्र"],["society","समाज"],["sports","खेलकुद"],["tech","प्रविधि"],["world","विश्व"]],all=[],active="all";
cats.forEach(function(c,i){var b=document.createElement("button");b.textContent=c[1];if(!i)b.className="active";b.onclick=function(){active=c[0];document.querySelectorAll("nav button").forEach(function(x){x.classList.remove("active")});b.classList.add("active");render()};document.getElementById("nav").appendChild(b)});
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]})}
function ago(x){var d=(Date.now()-new Date(x).getTime())/60000;if(!isFinite(d))return "";if(d<60)return Math.max(1,Math.floor(d))+" मिनेट अघि";if(d<1440)return Math.floor(d/60)+" घण्टा अघि";return Math.floor(d/1440)+" दिन अघि"}
function render(){var a=active==="all"?all:all.filter(function(n){return (n.category||"").indexOf(active)>=0});var box=document.getElementById("news");if(!a.length){box.innerHTML='<div class="empty">यो श्रेणीमा अहिले समाचार भेटिएन।</div>';return}box.innerHTML=a.map(function(n){return '<article class="card"><div class="meta"><span class="source">'+esc(n.source)+'</span><span>'+ago(n.published)+'</span></div><h2 class="title"><a href="'+esc(n.link)+'" target="_blank" rel="noopener">'+esc(n.title)+'</a></h2>'+(n.description?'<div class="desc">'+esc(n.description)+'</div>':'')+'<a class="read" href="'+esc(n.link)+'" target="_blank" rel="noopener">मूल समाचार पढ्नुहोस् →</a></article>'}).join("")}
function load(){fetch("./data/news.json?"+Date.now()).then(function(r){return r.json()}).then(function(d){all=d.items||[];document.getElementById("updated").textContent="अन्तिम अपडेट: "+new Date(d.updated_at).toLocaleString("ne-NP");document.getElementById("sources").textContent="स्रोतहरू: "+(d.sources||[]).join(" • ")+" | विस्तृत समाचारका लागि मूल स्रोत खोल्नुहोस्।";render()}).catch(function(){document.getElementById("news").innerHTML='<div class="empty">समाचार डेटा अहिले उपलब्ध भएन।</div>'})}load();setInterval(load,300000);
</script></body></html>
