<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="icon" href="logo.jpg"><style>
:root{--bg:#eef2f7;--ink:#101828;--muted:#667085;--glass:rgba(255,255,255,.76);--line:rgba(16,24,40,.1);--accent:#e11d48}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans Devanagari",sans-serif;background:radial-gradient(circle at 0 0,#fff,transparent 35%),radial-gradient(circle at 100% 10%,#dbeafe,transparent 30%),var(--bg)}.wrap{max-width:1180px;margin:auto;padding:16px}.box{background:var(--glass);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 15px 50px rgba(16,24,40,.09)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:11px;align-items:center}.logo{width:46px;height:46px;border-radius:15px;object-fit:cover}.eyebrow{font-size:11px;color:var(--accent);font-weight:900}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.72);color:var(--ink)}button{cursor:pointer;font-weight:800;background:#111827;color:#fff}.light{background:rgba(255,255,255,.7);color:#344054}.accent{background:var(--accent);border-color:var(--accent)}.grid{display:grid;grid-template-columns:1fr 360px;gap:14px}.cards{display:grid;gap:9px}.card{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.52);cursor:pointer}.card.active{outline:2px solid var(--accent)}.thumb{width:100px;height:72px;object-fit:cover;border-radius:12px;flex:none}.title{font-weight:850;line-height:1.5}.pill{display:inline-block;font-size:10px;padding:4px 7px;border-radius:999px;background:#f1f5f9;margin:2px}.preview{border:1px solid var(--line);border-radius:18px;background:#fff;padding:18px;white-space:pre-wrap;line-height:1.75;min-height:230px}.label{font-size:11px;font-weight:850;display:grid;gap:5px}.label input,.label textarea,.label select{width:100%}.toolbar{display:grid;gap:9px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:999px;font-weight:800;z-index:99}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:9px}.box{padding:13px;border-radius:20px}.top{align-items:flex-start}.thumb{width:82px;height:62px}}
</style></head><title>News + Image Studio — I Am From Hetauda</title></head><body><main class="wrap">
<section class="box"><div class="top"><div class="brand"><img class="logo" src="logo.jpg"><div><div class="eyebrow">I AM FROM HETAUDA • IMAGE POST</div><h1 style="margin:2px 0;font-size:23px">🖼️ News + Image Studio</h1><div class="muted">Image, headline, crop र social-ready output एकै ठाउँमा।</div></div></div><button class="light" onclick="history.back()">← Back</button></div></section>
<section class="grid"><div class="box"><div class="top"><h2 style="margin:0">News</h2><button class="light" onclick="shuffle()">🔀 Shuffle</button></div><input id="search" placeholder="🔎 selected news search…" oninput="draw()" style="width:100%;margin:10px 0"><div id="cards" class="cards"></div></div>
<div class="box"><div class="toolbar"><label class="label">Headline<textarea id="txt" rows="4" oninput="drawCanvas()"></textarea></label><label class="label">Template<select id="tpl" onchange="drawCanvas()"><option value="clean">Clean</option><option value="breaking">Breaking</option><option value="dark">Dark</option><option value="lower">Lower Third</option></select></label><label class="label">Headline size<input id="size" type="range" min="32" max="88" value="55" oninput="drawCanvas()"></label><label class="label">Overlay<input id="overlay" type="range" min="0" max="85" value="52" oninput="drawCanvas()"></label><label class="label">Text position<input id="pos" type="range" min="100" max="800" value="610" oninput="drawCanvas()"></label><label class="label">Accent<input id="accent" type="color" value="#e11d48" oninput="drawCanvas()"></label><div class="actions"><button class="accent" onclick="copyImage()">📋 Copy Image</button><button onclick="download()">⬇️ PNG</button></div></div><canvas id="cv" width="1080" height="1080" style="width:100%;border-radius:16px;margin-top:12px"></canvas></div></section>
<script>
let items=JSON.parse(localStorage.getItem("iam_selected_news")||"[]"),cur=items[0],img=null;const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/"/g,"&quot;");
function draw(){let q=$("search").value.toLowerCase(),a=items.filter(n=>(n.title+" "+(n.source||"")).toLowerCase().includes(q));$("cards").innerHTML=a.map(n=>'<div class="card '+(n===cur?"active":"")+'" onclick="pick('+items.indexOf(n)+')">'+(n.image?'<img class="thumb" src="'+esc(n.image)+'">':"")+'<div class="title">'+n.title+'</div></div>').join("")||'<div class="muted">No selected news.</div>';if(cur){$("txt").value=$("txt").value||cur.title;loadImg()}}
function pick(i){cur=items[i];$("txt").value=cur.title;loadImg();draw()}
function shuffle(){if(items.length>1){items.sort(()=>Math.random()-.5);cur=items[0];$("txt").value=cur.title;draw()}}
function loadImg(){img=new Image();img.crossOrigin="anonymous";img.onload=drawCanvas;img.onerror=drawCanvas;img.src=cur?.image||""}
function wrap(ctx,text,max){let lines=[],line="";for(const w of text.split(/\s+/)){let t=line?line+" "+w:w;if(ctx.measureText(t).width>max&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);return lines}
function drawCanvas(){let c=$("cv"),x=c.getContext("2d"),w=1080,h=1080;x.clearRect(0,0,w,h);if(img?.naturalWidth){let r=Math.max(w/img.naturalWidth,h/img.naturalHeight),nw=img.naturalWidth*r,nh=img.naturalHeight*r;x.drawImage(img,(w-nw)/2,(h-nh)/2,nw,nh)}else{x.fillStyle="#cbd5e1";x.fillRect(0,0,w,h)}let ov=+$("overlay").value/100,g=x.createLinearGradient(0,350,0,h);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,"+ov+")");x.fillStyle=g;x.fillRect(0,0,w,h);let tpl=$("tpl").value;if(tpl==="dark"){x.fillStyle="rgba(0,0,0,.35)";x.fillRect(0,0,w,h)}if(tpl==="breaking"){x.fillStyle=$("accent").value;x.fillRect(0,0,w,14);x.fillRect(45,720,250,62);x.fillStyle="#fff";x.font="800 30px sans-serif";x.fillText("🚨 BREAKING",62,763)}if(tpl==="lower"){x.fillStyle="rgba(0,0,0,.8)";x.fillRect(0,700,w,300)}x.font="800 "+$("size").value+"px 'Noto Sans Devanagari',sans-serif";x.fillStyle="#fff";x.textAlign="left";let lines=wrap(x,$("txt").value,w-110),y=+$("pos").value;lines.forEach((l,i)=>x.fillText(l,55,y+i*(+$("size").value*1.2)));x.fillStyle=$("accent").value;x.fillRect(55,h-82,170,8);x.fillStyle="#fff";x.font="800 28px sans-serif";x.fillText("I AM FROM HETAUDA",55,h-38)}
async function copyImage(){try{$("cv").toBlob(async b=>{await navigator.clipboard.write([new ClipboardItem({"image/png":b})]);alert("Image copied ✓")},"image/png")}catch(e){alert("Browser image-copy unavailable")}}
function download(){let a=document.createElement("a");a.download="iamfromhetauda-news.png";a.href=$("cv").toDataURL("image/png");a.click()}
draw();
</script></main></body></html>
