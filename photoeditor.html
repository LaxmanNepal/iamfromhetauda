<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><link rel="icon" href="logo.jpg"><style>
:root{--bg:#eef2f7;--ink:#101828;--muted:#667085;--glass:rgba(255,255,255,.76);--line:rgba(16,24,40,.1);--accent:#e11d48}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans Devanagari",sans-serif;background:radial-gradient(circle at 0 0,#fff,transparent 35%),radial-gradient(circle at 100% 10%,#dbeafe,transparent 30%),var(--bg)}.wrap{max-width:1180px;margin:auto;padding:16px}.box{background:var(--glass);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 15px 50px rgba(16,24,40,.09)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:11px;align-items:center}.logo{width:46px;height:46px;border-radius:15px;object-fit:cover}.eyebrow{font-size:11px;color:var(--accent);font-weight:900}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.72);color:var(--ink)}button{cursor:pointer;font-weight:800;background:#111827;color:#fff}.light{background:rgba(255,255,255,.7);color:#344054}.accent{background:var(--accent);border-color:var(--accent)}.grid{display:grid;grid-template-columns:1fr 360px;gap:14px}.cards{display:grid;gap:9px}.card{display:flex;gap:10px;padding:11px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.52);cursor:pointer}.card.active{outline:2px solid var(--accent)}.thumb{width:100px;height:72px;object-fit:cover;border-radius:12px;flex:none}.title{font-weight:850;line-height:1.5}.pill{display:inline-block;font-size:10px;padding:4px 7px;border-radius:999px;background:#f1f5f9;margin:2px}.preview{border:1px solid var(--line);border-radius:18px;background:#fff;padding:18px;white-space:pre-wrap;line-height:1.75;min-height:230px}.label{font-size:11px;font-weight:850;display:grid;gap:5px}.label input,.label textarea,.label select{width:100%}.toolbar{display:grid;gap:9px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:999px;font-weight:800;z-index:99}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:9px}.box{padding:13px;border-radius:20px}.top{align-items:flex-start}.thumb{width:82px;height:62px}}
</style></head><title>Advanced Photo Editor — I Am From Hetauda</title></head><body><main class="wrap">
<section class="box"><div class="top"><div class="brand"><img class="logo" src="logo.jpg"><div><div class="eyebrow">I AM FROM HETAUDA • PRO EDITOR</div><h1 style="margin:2px 0;font-size:23px">🎨 Advanced News Photo Editor</h1><div class="muted">Templates • crop • zoom • typography • colors • layers • fast export</div></div></div><button class="light" onclick="history.back()">← Back</button></div></section>
<section class="grid"><div class="box"><div class="top"><div><h2 style="margin:0">News library</h2><div class="muted" id="meta"></div></div><button class="light" onclick="shuffle()">🔀 Shuffle</button></div><input id="search" style="width:100%;margin:10px 0" placeholder="🔎 Search selected news…" oninput="drawList()"><div id="list" class="cards"></div></div>
<div class="box"><canvas id="cv" width="1080" height="1080" style="width:100%;border-radius:18px"></canvas><div class="toolbar" style="margin-top:12px">
<label class="label">Headline<textarea id="headline" rows="3" oninput="render()"></textarea></label>
<label class="label">Template<select id="template" onchange="render()"><option value="clean">Clean</option><option value="breaking">Breaking</option><option value="dark">Dark</option><option value="minimal">Minimal</option><option value="alert">Alert</option></select></label>
<div class="actions"><label class="label" style="flex:1">Accent<input id="accent" type="color" value="#e11d48" oninput="render()"></label><label class="label" style="flex:1">Text<input id="textColor" type="color" value="#ffffff" oninput="render()"></label></div>
<label class="label">Font size<input id="size" type="range" min="26" max="100" value="56" oninput="render()"></label>
<label class="label">Headline Y<input id="y" type="range" min="80" max="820" value="650" oninput="render()"></label>
<label class="label">Overlay<input id="overlay" type="range" min="0" max="90" value="55" oninput="render()"></label>
<label class="label">Image zoom<input id="zoom" type="range" min="100" max="180" value="100" oninput="render()"></label>
<label class="label">Logo <select id="logoOn" onchange="render()"><option value="yes">Show</option><option value="no">Hide</option></select></label>
<label class="label">Headline alignment<select id="align" onchange="render()"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></label>
<div class="actions"><button class="accent" onclick="copy()">📋 Copy Image</button><button onclick="download()">⬇️ Export PNG</button><button class="light" onclick="reset()">↺ Reset</button></div></div></div></section>
<script>
let items=JSON.parse(localStorage.getItem("iam_selected_news")||"[]"),cur=items[0],img=null;const $=id=>document.getElementById(id);
function drawList(){let q=$("search").value.toLowerCase(),a=items.filter(n=>(n.title+" "+(n.source||"")).toLowerCase().includes(q));$("meta").textContent=items.length+" selected";$("list").innerHTML=a.map(n=>'<div class="card '+(n===cur?"active":"")+'" onclick="pick('+items.indexOf(n)+')">'+(n.image?'<img class="thumb" src="'+n.image.replace(/"/g,"&quot;")+'">':"")+'<div><span class="pill">'+(n.source||"")+'</span><div class="title">'+n.title+'</div></div></div>').join("")||'<div class="muted">Admin बाट news select गर्नुहोस्।</div>'}
function pick(i){cur=items[i];$("headline").value=cur.title;load()}
function shuffle(){items.sort(()=>Math.random()-.5);cur=items[0];if(cur)$("headline").value=cur.title;drawList();load()}
function load(){img=new Image();img.crossOrigin="anonymous";img.onload=render;img.onerror=render;img.src=cur?.image||""}
function render(){let c=$("cv"),x=c.getContext("2d"),w=1080,h=1080;x.clearRect(0,0,w,h);let z=+$("zoom").value/100;if(img?.naturalWidth){let r=Math.max(w/img.naturalWidth,h/img.naturalHeight)*z,nw=img.naturalWidth*r,nh=img.naturalHeight*r;x.drawImage(img,(w-nw)/2,(h-nh)/2,nw,nh)}else{x.fillStyle="#cbd5e1";x.fillRect(0,0,w,h)}let o=+$("overlay").value/100;x.fillStyle="rgba(0,0,0,"+o*.35+")";x.fillRect(0,0,w,h);let g=x.createLinearGradient(0,450,0,h);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,"+o+")");x.fillStyle=g;x.fillRect(0,0,w,h);let t=$("template").value;if(t==="dark"){x.fillStyle="rgba(0,0,0,.45)";x.fillRect(0,0,w,h)}if(t==="breaking"||t==="alert"){x.fillStyle=$("accent").value;x.fillRect(0,0,w,16);x.fillRect(50,50,250,60);x.fillStyle="#fff";x.font="800 28px sans-serif";x.fillText(t==="breaking"?"🚨 BREAKING":"⚡ NEWS ALERT",70,90)}if(t==="minimal"){x.fillStyle="rgba(255,255,255,.9)";x.fillRect(45,790,990,210)}let size=+$("size").value;x.font="800 "+size+"px 'Noto Sans Devanagari',sans-serif";x.fillStyle=$("textColor").value;x.textAlign=$("align").value;let align=$("align").value,xx=align==="left"?55:align==="right"?1025:540,lines=[],line="";for(let w1 of ($("headline").value||"").split(/\s+/)){let test=line?line+" "+w1:w1;if(x.measureText(test).width>970&&line){lines.push(line);line=w1}else line=test}if(line)lines.push(line);let yy=+$("y").value;lines.forEach((l,i)=>{x.lineWidth=9;x.strokeStyle="rgba(0,0,0,.5)";x.strokeText(l,xx,yy+i*size*1.18);x.fillText(l,xx,yy+i*size*1.18)});if($("logoOn").value==="yes"){let l=new Image();l.onload=()=>x.drawImage(l,40,40,100,100);l.src="logo.jpg"}x.fillStyle=$("accent").value;x.fillRect(55,h-70,180,7);x.fillStyle="#fff";x.textAlign="left";x.font="800 27px sans-serif";x.fillText("I AM FROM HETAUDA",55,h-28)}
async function copy(){try{$("cv").toBlob(async b=>{await navigator.clipboard.write([new ClipboardItem({"image/png":b})]);alert("Image copied ✓")},"image/png")}catch(e){alert("Copy unavailable")}}
function download(){let a=document.createElement("a");a.download="iamfromhetauda-news.png";a.href=$("cv").toDataURL("image/png");a.click()}
function reset(){$("template").value="clean";$("accent").value="#e11d48";$("textColor").value="#ffffff";$("size").value=56;$("y").value=650;$("overlay").value=55;$("zoom").value=100;$("logoOn").value="yes";$("align").value="left";$("headline").value=cur?.title||"";render()}
if(cur)$("headline").value=cur.title;drawList();load();
</script></main></body></html>
