name: Refresh Iran war news feed
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iran-war-feed
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Collect global publisher coverage and public X posts
        env:
          PYTHONUNBUFFERED: "1"
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, time, html, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=24)
          headers = {'User-Agent':'Mozilla/5.0 (compatible; IamFromHetaudaNewsBot/3.0; +https://laxmannepal.github.io/iamfromhetauda/)'}
          items, seen = [], set()
          errors = []

          def translate_ne(text):
              text = (text or '').strip()
              if not text: return ''
              try:
                  params = urllib.parse.urlencode({'client':'gtx','sl':'auto','tl':'ne','dt':'t','q':text[:4500]})
                  req = urllib.request.Request('https://translate.googleapis.com/translate_a/single?'+params, headers=headers)
                  with urllib.request.urlopen(req, timeout=16) as response:
                      data = json.loads(response.read().decode('utf-8'))
                  translated = ''.join(part[0] for part in data[0] if part and part[0])
                  return translated.strip() or text
              except Exception as exc:
                  print('Translation fallback:', str(exc))
                  return text

          def add_item(item):
              url = item.get('url','').strip()
              key = re.sub(r'[?#].*$', '', url).rstrip('/') or item.get('id')
              if not key or key in seen: return
              seen.add(key)
              original_title = item.get('title','')
              original_desc = item.get('description','')
              item['original_title'] = original_title
              item['original_description'] = original_desc
              # One translation request per story keeps the scheduled job within its time budget.
              combined = original_title + ('\n\n' + original_desc if original_desc else '')
              translated = translate_ne(combined)
              parts = translated.split('\n\n',1)
              item['title'] = parts[0].strip() or original_title
              item['description'] = parts[1].strip() if len(parts)>1 else (translate_ne(original_desc) if original_desc and translated==original_title else original_desc)
              item['language'] = 'ne' if item['title'] != original_title else 'original'
              item['dedupe_key'] = key
              items.append(item)

          # Google News indexes a wide range of publishers. Source-specific queries
          # deliberately broaden discovery beyond a single generic search.
          queries = [
            'Iran war OR Iran conflict OR US Iran strikes',
            'Israel Iran US military attacks OR airstrikes',
            'Strait of Hormuz OR Persian Gulf shipping OR tanker',
            'Iran ceasefire OR Iran US negotiations OR Qatar mediation',
            'Kuwait OR Gulf security OR Saudi Arabia OR UAE Iran',
            'Iraq Yemen Houthi attacks OR regional conflict',
            'Iran oil gas energy sanctions nuclear',
            'Iran war site:bbc.com/news',
            'Iran war site:reuters.com',
            'Iran war site:apnews.com',
            'Iran war site:aljazeera.com',
            'Iran war site:cnn.com',
            'Iran war site:theguardian.com',
            'Iran war site:dw.com',
            'Iran war site:france24.com',
            'Iran war site:news.sky.com',
            'Iran war site:pbs.org OR site:npr.org',
            'Iran war site:un.org OR site:iaea.org',
            'Iran war site:centcom.mil OR site:state.gov',
            'Iran war site:kuna.net.kw OR site:arabnews.com OR site:thenationalnews.com'
          ]
          for query in queries:
              rss = 'https://news.google.com/rss/search?q=' + urllib.parse.quote(query + ' when:1d') + '&hl=en-US&gl=US&ceid=US:en'
              try:
                  req = urllib.request.Request(rss, headers=headers)
                  with urllib.request.urlopen(req, timeout=22) as response:
                      root = ET.fromstring(response.read())
                  for node in root.findall('./channel/item'):
                      title = (node.findtext('title') or '').strip()
                      link = (node.findtext('link') or '').strip()
                      source_node = node.find('source')
                      source = (source_node.text or '').strip() if source_node is not None else 'News publisher'
                      pub = (node.findtext('pubDate') or '').strip()
                      desc = html.unescape(re.sub(r'<[^>]+>', ' ', node.findtext('description') or ''))
                      desc = re.sub(r'\s+', ' ', desc).strip()
                      try: published_dt = parsedate_to_datetime(pub).astimezone(timezone.utc)
                      except Exception: continue
                      if not title or not link or published_dt < cutoff or published_dt > now + timedelta(minutes=10): continue
                      add_item({'id':link,'title':title,'url':link,'source':source,'source_type':'news',
                                'published':published_dt.isoformat(),'description':desc[:1800]})
              except Exception as exc:
                  errors.append('Google News query failed: '+query+' · '+str(exc)[:180])
              time.sleep(0.15)

          token = os.environ.get('X_BEARER_TOKEN','').strip()
          x_status = 'not_configured'
          x_count = 0
          if token:
              x_query = '(Iran OR Tehran OR Hormuz OR Qeshm OR "Persian Gulf" OR Israel OR Kuwait OR Iraq OR Yemen) (war OR strike OR attack OR tanker OR missile OR ceasefire OR blockade OR shipping OR diplomacy OR drone OR explosion) -is:retweet'
              next_token = None
              try:
                  for page in range(5):
                      params = {
                        'query':x_query,'start_time':cutoff.strftime('%Y-%m-%dT%H:%M:%SZ'),
                        'end_time':now.strftime('%Y-%m-%dT%H:%M:%SZ'),'max_results':'100',
                        'sort_order':'recency',
                        'tweet.fields':'created_at,public_metrics,lang,author_id,context_annotations,entities',
                        'expansions':'author_id','user.fields':'name,username,verified'
                      }
                      if next_token: params['next_token'] = next_token
                      endpoint = 'https://api.x.com/2/tweets/search/recent?'+urllib.parse.urlencode(params)
                      req = urllib.request.Request(endpoint,headers={'Authorization':'Bearer '+token,'User-Agent':'IamFromHetaudaNewsBot/3.0'})
                      with urllib.request.urlopen(req,timeout=35) as response:
                          result = json.loads(response.read().decode('utf-8'))
                      users = {u['id']:u for u in result.get('includes',{}).get('users',[])}
                      for post in result.get('data',[]):
                          author = users.get(post.get('author_id'),{})
                          username = author.get('username','unknown')
                          post_id = post.get('id')
                          created = post.get('created_at','')
                          metrics = post.get('public_metrics',{})
                          add_item({'id':'x:'+str(post_id),'title':post.get('text','').replace('\n',' '),
                                    'url':'https://x.com/'+username+'/status/'+str(post_id),
                                    'source':'X · @'+username,'source_type':'x','author':author.get('name',username),
                                    'verified_author':author.get('verified',False),'published':created,
                                    'description':'','lang_original':post.get('lang',''),
                                    'metrics':{'likes':metrics.get('like_count',0),'reposts':metrics.get('retweet_count',0),
                                               'replies':metrics.get('reply_count',0),'quotes':metrics.get('quote_count',0)}})
                          x_count += 1
                      next_token = result.get('meta',{}).get('next_token')
                      if not next_token: break
                  x_status = 'connected'
                  print('Collected',x_count,'public X posts across up to 5 pages')
              except Exception as exc:
                  x_status = 'error'
                  errors.append('X API: '+str(exc)[:220])
                  print('X API collection failed:',str(exc))
          else:
              print('X_BEARER_TOKEN secret not configured; X collection skipped.')

          items.sort(key=lambda x:x.get('published',''),reverse=True)
          # Keep a generous cap so the UI can paginate without silently losing the entire feed.
          items = items[:500]
          publishers = sorted(set(x.get('source','') for x in items if x.get('source')))
          payload = {
            'updated':now.isoformat(),'window_start':cutoff.isoformat(),'window_hours':24,
            'items':items,
            'sources':{'google_news':'enabled','publisher_queries':len(queries),'publishers':publishers,
                       'x_api':x_status,'x_posts_collected':x_count},
            'collection':{'unique_reports':len(items),'max_x_pages':5,'max_x_posts_per_run':500,
                          'errors':errors[:12]},
            'note':'Aggregated public reports from Google News publisher-indexed searches and optional X API. Not every internet post is accessible. Nepali machine translation may be imperfect; claims require independent verification.'
          }
          Path('Iranwar/alerts.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Saved',len(items),'unique reports from the last 24 hours.')
          PY
      - name: Publish updated feed
        run: |
          if git diff --quiet -- Iranwar/alerts.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Iranwar/alerts.json
          git commit -m "chore: broaden global Iran war news and X collection"
          git push
