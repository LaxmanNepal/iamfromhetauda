name: Refresh Iran war news feed
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iran-war-feed
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Collect last 24 hours of news and public X posts
        env:
          PYTHONUNBUFFERED: "1"
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=24)
          headers = {'User-Agent':'Mozilla/5.0 (compatible; IamFromHetaudaNewsBot/2.0)'}
          items, seen = [], set()

          def translate_ne(text):
              text = (text or '').strip()
              if not text: return ''
              try:
                  params = urllib.parse.urlencode({'client':'gtx','sl':'auto','tl':'ne','dt':'t','q':text[:4500]})
                  req = urllib.request.Request('https://translate.googleapis.com/translate_a/single?'+params, headers=headers)
                  with urllib.request.urlopen(req, timeout=18) as response:
                      data = json.loads(response.read().decode('utf-8'))
                  translated = ''.join(part[0] for part in data[0] if part and part[0])
                  return translated.strip() or text
              except Exception as exc:
                  print('Translation fallback:', str(exc))
                  return text

          def add_item(item):
              key = item.get('url') or item.get('id')
              if not key or key in seen: return
              seen.add(key)
              original_title = item.get('title','')
              original_desc = item.get('description','')
              item['original_title'] = original_title
              item['original_description'] = original_desc
              item['title'] = translate_ne(original_title)
              item['description'] = translate_ne(original_desc) if original_desc else ''
              item['language'] = 'ne' if item['title'] != original_title else 'original'
              items.append(item)

          news_queries = [
            'Iran war OR Iran conflict OR US Iran strikes',
            'Israel Iran US military attacks OR airstrikes',
            'Strait of Hormuz OR Persian Gulf shipping OR tanker',
            'Iran ceasefire OR Iran US negotiations OR Qatar mediation',
            'Kuwait OR Gulf security OR Saudi Arabia OR UAE Iran',
            'Iraq Yemen Houthi attacks OR regional conflict',
            'Iran oil gas energy sanctions'
          ]
          for query in news_queries:
              url = 'https://news.google.com/rss/search?q=' + urllib.parse.quote(query + ' when:1d') + '&hl=en-US&gl=US&ceid=US:en'
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=25) as response:
                      root = ET.fromstring(response.read())
                  for node in root.findall('./channel/item'):
                      title = (node.findtext('title') or '').strip()
                      link = (node.findtext('link') or '').strip()
                      source_node = node.find('source')
                      source = (source_node.text or '').strip() if source_node is not None else 'News source'
                      pub = (node.findtext('pubDate') or '').strip()
                      desc = re.sub(r'<[^>]+>', ' ', node.findtext('description') or '')
                      desc = re.sub(r'\s+, ' ', desc).strip()
                      try: published_dt = parsedate_to_datetime(pub).astimezone(timezone.utc)
                      except Exception: continue
                      if published_dt < cutoff or published_dt > now + timedelta(minutes=10): continue
                      add_item({'id':link,'title':title,'url':link,'source':source,'source_type':'news',
                                'published':published_dt.isoformat(),'description':desc[:700]})
              except Exception as exc:
                  print('Google News feed failed:', query, str(exc))

          token = os.environ.get('X_BEARER_TOKEN','').strip()
          x_status = 'not_configured'
          if token:
              x_query = '(Iran OR Tehran OR Hormuz OR Qeshm OR "Persian Gulf" OR Israel) (war OR strike OR attack OR tanker OR missile OR ceasefire OR blockade OR shipping OR diplomacy) -is:retweet'
              params = urllib.parse.urlencode({
                  'query':x_query,
                  'start_time':cutoff.strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'end_time':now.strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'max_results':'100',
                  'sort_order':'recency',
                  'tweet.fields':'created_at,public_metrics,lang,author_id',
                  'expansions':'author_id',
                  'user.fields':'name,username,verified'
              })
              req = urllib.request.Request('https://api.x.com/2/tweets/search/recent?'+params,
                    headers={'Authorization':'Bearer '+token,'User-Agent':'IamFromHetaudaNewsBot/2.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.loads(response.read().decode('utf-8'))
                  users = {u['id']:u for u in result.get('includes',{}).get('users',[])}
                  for post in result.get('data',[]):
                      author = users.get(post.get('author_id'),{})
                      username = author.get('username','unknown')
                      post_id = post.get('id')
                      created = post.get('created_at','')
                      metrics = post.get('public_metrics',{})
                      add_item({'id':'x:'+str(post_id),'title':post.get('text','').replace('\n',' '),
                                'url':'https://x.com/'+username+'/status/'+str(post_id),
                                'source':'X · @'+username,'source_type':'x','author':author.get('name',username),
                                'verified_author':author.get('verified',False),'published':created,
                                'description':'','lang_original':post.get('lang',''),
                                'metrics':{'likes':metrics.get('like_count',0),'reposts':metrics.get('retweet_count',0),
                                           'replies':metrics.get('reply_count',0),'quotes':metrics.get('quote_count',0)}})
                  x_status = 'connected'
                  print('Collected',len(result.get('data',[])),'public X posts')
              except Exception as exc:
                  x_status = 'error'
                  print('X API collection failed:',str(exc))
          else:
              print('X_BEARER_TOKEN secret not configured; X collection skipped.')

          items.sort(key=lambda x:x.get('published',''), reverse=True)
          payload = {
            'updated':now.isoformat(),
            'window_start':cutoff.isoformat(),
            'window_hours':24,
            'items':items[:250],
            'sources':{'google_news':'enabled','x_api':x_status},
            'note':'Last-24-hour public news headlines and, when configured, public X API posts. Nepali translation is machine-generated. Claims are not independently verified.'
          }
          path=Path('Iranwar/alerts.json')
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Saved',len(payload['items']),'items from the last 24 hours.')
          PY
      - name: Publish updated feed
        run: |
          if git diff --quiet -- Iranwar/alerts.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Iranwar/alerts.json
          git commit -m "chore: refresh 24-hour Nepali Iran war news and X feed"
          git push
