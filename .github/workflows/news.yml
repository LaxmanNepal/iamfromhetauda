name: Refresh Nepal News
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/news.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_news.py
      - run: |
          git config user.name "I Am From Hetauda News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "chore: refresh Nepal news feed"
          git push
