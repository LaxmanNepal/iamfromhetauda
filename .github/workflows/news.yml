name: Refresh Nepal News
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/news.json"
      - "data/today-post.json"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest news
        run: |
          if [ -f data/news.json ]; then cp data/news.json /tmp/news-before.json; fi
          python3 fetch_news.py

      - name: Notify push subscribers of new stories
        env:
          PUSH_API_BASE: ${{ secrets.PUSH_API_BASE }}
          PUSH_ADMIN_KEY: ${{ secrets.PUSH_ADMIN_KEY }}
        run: python3 scripts/push_new_news.py

      - name: Commit refreshed news
        run: |
          git config user.name "I Am From Hetauda News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/today-post.json images/
          git diff --cached --quiet || git commit -m "chore: refresh Nepal news feed"
          git push
